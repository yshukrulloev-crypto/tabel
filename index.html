<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Табель бригад</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Прорабский журнал: плотные списки, моноширинные цифры, коды табеля Т-13 (Я, В, ОТ, Б, ПР). */
:root {
  --bg: #eef0ec; --surface: #ffffff; --surface-2: #f4f5f2; --fg: #16191b; --muted: #596066; --hint: #868c91;
  --line: #dde1db; --accent: #146c5f; --accent-fg: #ffffff; --accent-weak: #dcece8;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --good-bg: #e2f4e2; --warn-bg: #fdf1d6; --crit-bg: #f9e1e1; --ot-bg: #fbe8dc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --surface: #1a1e21; --surface-2: #22272a; --fg: #eef0f1; --muted: #a5abaf; --hint: #7d8488;
    --line: #2d3337; --accent: #3fb6a3; --accent-fg: #06211c; --accent-weak: #173430;
    --good-bg: #16301a; --warn-bg: #3a2e12; --crit-bg: #3b1d1d; --ot-bg: #3a2519;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --surface: #1a1e21; --surface-2: #22272a; --fg: #eef0f1; --muted: #a5abaf; --hint: #7d8488;
  --line: #2d3337; --accent: #3fb6a3; --accent-fg: #06211c; --accent-weak: #173430;
  --good-bg: #16301a; --warn-bg: #3a2e12; --crit-bg: #3b1d1d; --ot-bg: #3a2519;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .hint { color: var(--hint); }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; }

/* demo bar */
#demo { background: var(--accent-weak); color: var(--fg); font-size: 13px; }
#demo .wrap { display: flex; gap: 8px; align-items: center; padding-block: 8px; flex-wrap: wrap; }
#demo b { font-weight: 600; }
#demo select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13px; max-width: 100%; }

/* top */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
#top .wrap { padding-block: 10px 8px; display: grid; gap: 8px; }
.title-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.title-row h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.title-row .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.icon-btn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.spin svg { animation: rot 1s linear infinite; } @keyframes rot { to { transform: rotate(360deg); } }
.chip.wait { background: var(--warn-bg); }
.chip.night { background: var(--surface-2); color: var(--s7); } .chip.night svg { color: var(--s7); }
.shiftsw { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.shiftsw button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 6px; display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); }
.shiftsw button svg { width: 18px; height: 18px; }
.shiftsw button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); color: var(--fg); font-weight: 600; }
.mx .nt { color: var(--s7); font-weight: 600; }
.receipt .f { font-size: 12px; color: var(--hint); margin-top: -4px; }
.receipt .f span { font-family: var(--mono); }
.pay-row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.pay-row:first-child { border-top: 0; }
.pay-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.obj-pay { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
.obj-pay > div:last-child { display: flex; gap: 10px; align-items: center; justify-content: space-between; text-align: left !important; flex-wrap: wrap; }
.obj-pay > div:last-child .btn { margin-top: 0 !important; }
.obj-pay:first-child { border-top: 0; }
.ctrl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.stepper button { border: 0; background: transparent; width: 34px; height: 32px; font-size: 18px; color: var(--muted); }
.stepper button:disabled { opacity: .3; cursor: default; }
.stepper span { padding: 0 4px; font-weight: 500; font-size: 14px; min-width: 130px; text-align: center; }
.sel { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; max-width: 100%; min-width: 0; }

/* view */
main { padding-block: 12px 96px; }
.stack { display: grid; gap: 12px; }
.card { background: var(--surface); border-radius: var(--r); padding: 14px; min-width: 0; }
.card h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.card h2 .r { float: right; text-transform: none; letter-spacing: 0; font-weight: 500; }

/* tabs */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tabs .wrap { display: flex; }
#tabs button { flex: 1; border: 0; background: transparent; padding: 8px 4px 9px; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--hint); }
#tabs button svg { width: 22px; height: 22px; }
#tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* buttons */
.btn { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 600; background: var(--accent); color: var(--accent-fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.sec { background: var(--surface-2); color: var(--fg); }
.btn.danger { background: var(--crit); color: #fff; }
.btn.danger-ghost { background: transparent; color: var(--crit); border: 1px solid var(--line); }
#tabs button { position: relative; }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 600; line-height: 17px; font-family: var(--mono); }
.notice { border-left: 3px solid var(--crit); background: var(--crit-bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.picks { display: grid; gap: 6px; }
.picks label { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 14px; cursor: pointer; }
.picks label:has(input:checked) { border-color: var(--accent); background: var(--accent-weak); }
.field .picks label { color: var(--fg); font-size: 14px; }
.field .picks input, .picks input { accent-color: var(--accent); margin: 0; width: 18px; height: 18px; padding: 0; flex: none; background: none; border: 0; }
.field textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 64px; resize: vertical; font: inherit; color: inherit; }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; }
.ev { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); }
.ev.in { background: var(--good-bg); } .ev.out { background: var(--crit-bg); } .ev.mv { background: var(--accent-weak); }
.btn.ghost { background: transparent; color: var(--accent); padding-inline: 6px; }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 8px; }
.btn:disabled { opacity: .5; }
.btn svg { width: 18px; height: 18px; }

/* KPI */
.hero { display: grid; gap: 2px; }
.hero .lbl { color: var(--muted); font-size: 13px; }
.hero .big { font-family: var(--mono); font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.delta { font-size: 13px; color: var(--muted); }
.delta b { font-weight: 600; color: var(--fg); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { background: var(--surface); padding: 12px 14px; min-width: 0; }
.tile .lbl { font-size: 12px; color: var(--muted); }
.tile .val { font-family: var(--mono); font-size: 19px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .note { font-size: 12px; color: var(--hint); margin-top: 1px; }

/* today strip */
.strip { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.strip span { display: inline-flex; align-items: center; gap: 6px; }
.strip b { color: var(--fg); font-family: var(--mono); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--surface-2); color: var(--fg); white-space: nowrap; }
.chip svg { width: 13px; height: 13px; }
.chip.good { background: var(--good-bg); } .chip.good svg { color: var(--good); }
.chip.warn { background: var(--warn-bg); } .chip.warn svg { color: var(--warn); }
.chip.crit { background: var(--crit-bg); } .chip.crit svg { color: var(--crit); }
.code { font-family: var(--mono); font-weight: 600; font-size: 11px; }

/* list rows */
.list { display: grid; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row.tap { cursor: pointer; }
.row .main { flex: 1; min-width: 0; }
.row .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.row .side { text-align: right; flex: none; }
.row .side .v { font-family: var(--mono); font-weight: 600; }
.row .side .s { font-size: 12px; color: var(--hint); }
.grp { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 14px 0 4px; }
.act { min-width: 92px; }

/* object cards */
.obj { display: grid; gap: 8px; cursor: pointer; }
.obj-head { display: flex; align-items: baseline; gap: 8px; }
.obj-head .n { font-weight: 600; flex: 1; min-width: 0; }
.obj-head .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; transform: translateY(1px); }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
.kv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kv div { min-width: 0; }
.kv .l { font-size: 11px; color: var(--hint); }
.kv .v { font-family: var(--mono); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* rank */
.rank .row { padding: 8px 0; }
.bar { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 5px; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--muted); }

/* chart */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--hint); font: 11px var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; border-radius: 8px; padding: 7px 9px; min-width: 130px; z-index: 2; box-shadow: 0 4px 16px rgb(0 0 0 / .18); }
.tip .t { font-weight: 600; margin-bottom: 3px; }
.tip .l { display: flex; justify-content: space-between; gap: 12px; }
.tip .l span:last-child { font-family: var(--mono); }
.tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }

/* timesheet matrix */
.mx-wrap { overflow-x: auto; }
table.mx { border-collapse: separate; border-spacing: 0; font-size: 12px; }
.mx th, .mx td { padding: 0; height: 30px; text-align: center; border-bottom: 1px solid var(--line); }
.mx thead th { font-weight: 500; color: var(--muted); font-family: var(--mono); height: 34px; line-height: 1.1; }
.mx thead th small { display: block; font-size: 9px; color: var(--hint); font-family: var(--font); }
.mx .nm { position: sticky; left: 0; background: var(--surface); text-align: left; padding: 0 10px 0 0; min-width: 132px; max-width: 132px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1; cursor: pointer; font-family: var(--font); font-size: 13px; }
.mx .d { min-width: 30px; font-family: var(--mono); position: relative; }
.mx .we { background: var(--surface-2); }
.mx .td { box-shadow: inset 0 0 0 1.5px var(--accent); }
.mx .ot { background: var(--ot-bg); font-weight: 600; }
.mx .late::after { content: ''; position: absolute; top: 4px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
.mx .cd { color: var(--muted); font-weight: 600; font-size: 10px; }
.mx .cd.pr { color: var(--crit); }
.mx .tot { font-family: var(--mono); font-weight: 600; padding: 0 6px; min-width: 50px; }
.mx-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.mx-legend b { font-family: var(--mono); color: var(--fg); }

/* sheets & pages */
#scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 20; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 16px 16px 0 0; max-height: 88%; overflow: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
#sheet .wrap { padding-block: 8px 18px; display: grid; gap: 14px; }
.sheet-x { position: absolute; top: 6px; right: 8px; z-index: 2; }
.help li { margin-bottom: 6px; }
.steps { display: grid; gap: 8px; }
.steps .st { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.steps .st i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; flex: none; background: var(--surface-2); color: var(--muted); }
.steps .st.ok i { background: var(--good-bg); color: var(--good); }
.steps .st.ok span { color: var(--muted); text-decoration: line-through; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 6px auto 0; }
#sheet h3 { margin: 0; font-size: 18px; }
#page { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow: auto; }
#page .top { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 2; padding-top: env(safe-area-inset-top, 0px); }
#page .top .wrap { display: flex; align-items: center; gap: 6px; padding-block: 8px; }
#page main { padding-bottom: 40px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.seg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 2px; display: grid; gap: 1px; font-size: 11px; color: var(--muted); }
.seg button b { font-family: var(--mono); font-size: 14px; color: var(--fg); }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); color: var(--fg); }
.receipt { display: grid; gap: 6px; font-size: 14px; }
.receipt div { display: flex; justify-content: space-between; gap: 10px; }
.receipt span:last-child { font-family: var(--mono); }
.receipt .sum { border-top: 1px dashed var(--line); padding-top: 8px; font-weight: 700; font-size: 16px; }
.err { color: var(--crit); font-size: 13px; }
#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.center-screen { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 12px; padding-block: 24px; }
.center-screen .id { font-family: var(--mono); font-size: 28px; font-weight: 600; background: var(--surface); padding: 10px 16px; border-radius: 10px; user-select: all; }
.search { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; }
.xtable { overflow-x: auto; }
.xtable table { border-collapse: collapse; font-size: 12px; }
.xtable td, .xtable th { border: 1px solid var(--line); padding: 4px 6px; white-space: nowrap; }
.xtable th { background: var(--surface-2); font-weight: 600; }
.tabs2 { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs2 button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.tabs2 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  #sheet { animation: up .18s ease-out; }
  #page { animation: fade .15s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
  @keyframes fade { from { opacity: 0; } }
}
</style>

</head>
<body>
<div id="demo" hidden></div>
<header id="top"><div class="wrap"></div></header>
<main id="view" class="wrap"><div class="center-screen"><div class="muted">Загрузка…</div></div></main>
<nav id="tabs" hidden><div class="wrap"></div></nav>
<div id="page" hidden></div>
<div id="scrim" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
/* ================================================================
   ЯДРО: расчёты табеля, отчёты, права доступа.
   Один и тот же код работает на сервере (Apps Script) и в демо.
   ================================================================ */
var Core = (function () {
  var C = (typeof CONFIG !== 'undefined' && CONFIG) || {};
  function opt(k, d) { return C[k] === undefined ? d : C[k]; }
  var CFG = {
    lateGraceMin: opt('lateGraceMin', 5),          // опоздание считается, если больше N минут
    defaultLunch: opt('defaultLunch', 60),         // обед по умолчанию, минут
    foremanEditDays: opt('foremanEditDays', 3),    // бригадир может править последние N дней
    foremanSeesPay: opt('foremanSeesPay', true),   // бригадир видит суммы зарплаты
    foremanGivesAdvance: opt('foremanGivesAdvance', false), // бригадир может вносить авансы
    foremanCanExport: opt('foremanCanExport', true),
    foremanSetsRate: opt('foremanSetsRate', true), // бригадир указывает ставку при приёме
    nightFrom: opt('nightFrom', '22:00'),          // ночное время по ТК РФ (ст. 96): с 22:00

      .concat(D.advances.filter(function (a) { return eq(a.payerTgId, tgId); }).map(function (a) { return { id: a.id, kind: 'Аванс', date: a.date, name: a.empName, amount: a.amount, ack: a.ack || '', ackNote: a.ackNote || '' }; }))
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    c.expenses = (D.expenses || []).filter(function (x) { return eq(x.payerTgId, tgId); }).sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 40).map(function (x) { return expenseView(x, objs); });
    c.disputes = out.filter(function (a) { return a.ack === ACK_NO; });
    c.transfers = tr.slice(0, 20).map(function (t) { var x = JSON.parse(JSON.stringify(t)); x.objectName = (objs[t.objectId] || {}).name || ''; return x; });
    c.payouts = out.slice(0, 30);
    c.pendingList = tr.filter(function (t) { return t.status !== RECEIVED; });
    return c;
  }

  /* ---------- сводка для руководителя ---------- */
  function dashboard(D, month, today, todayOf) {
    todayOf = todayOf || function () { return today; };
    var all = function () { return true; };
    var rows = monthRows(D, month, all);
    var isCur = monthOf(today) === month;
    var n = dim(month), lastDay = isCur ? +today.slice(8, 10) : n;
    var objects = D.objects.filter(function (o) { return o.active; });
    var perObj = {};
    objects.forEach(function (o) {
      perObj[o.id] = { id: o.id, name: o.name, shiftStart: o.shiftStart, headcount: 0, presentToday: 0, onSite: 0, lateToday: 0,
        hours: 0, ot: 0, sum: 0, advance: 0, late: 0, absent: 0, days: 0 };
    });
    D.employees.forEach(function (e) { if (e.active && perObj[e.objectId]) perObj[e.objectId].headcount++; });
    var daily = [];
    for (var d = 1; d <= n; d++) daily.push({ day: d, date: month + '-' + pad(d), total: 0, hours: 0, present: 0, byObj: {} });
    var status = {}; STATUSES.forEach(function (s) { status[s.id] = 0; });
    var prevMonth = addMonths(month, -1), prevSum = 0;
    D.records.forEach(function (r) {
      var o = perObj[r.objectId];
      if (o && r.date === todayOf(r.objectId) && r.status === 'Явка') {
        o.presentToday++; if (r.in && !r.out) o.onSite++; if (r.late) o.lateToday++;
      }
      if (monthOf(r.date) === prevMonth && +r.date.slice(8, 10) <= lastDay && r.status === 'Явка') prevSum += r.sum;
      if (monthOf(r.date) !== month) return;
      status[r.status] = (status[r.status] || 0) + 1;
      if (!o) return;
      if (r.status === 'Явка') {
        var dd = daily[+r.date.slice(8, 10) - 1];
        dd.total += r.sum; dd.hours += r.hours; dd.present++; dd.byObj[r.objectId] = (dd.byObj[r.objectId] || 0) + r.sum;
        o.hours += r.hours; o.ot += r.ot; o.sum += r.sum; o.days++; if (r.late) o.late++;
      } else if (r.status === 'Прогул') o.absent++;
    });
    D.advances.forEach(function (a) { if (monthOf(a.date) === month && perObj[a.objectId]) perObj[a.objectId].advance += +a.amount || 0; });
    daily.forEach(function (x) { x.total = r2(x.total); x.hours = r2(x.hours); Object.keys(x.byObj).forEach(function (k) { x.byObj[k] = r2(x.byObj[k]); }); });
    var objList = objects.map(function (o) {
      var x = perObj[o.id];
      ['hours', 'ot', 'sum', 'advance'].forEach(function (k) { x[k] = r2(x[k]); });
      var orows = rows.filter(function (r) { return eq(r.objectId, o.id); });
      x.toPay = r2(orows.reduce(function (s, r) { return s + Math.max(0, r.toPay); }, 0));
      x.accrued = r2(orows.reduce(function (s, r) { return s + r.accrued; }, 0));
      x.paidOut = r2(orows.reduce(function (s, r) { return s + r.advance + r.paid; }, 0));
      x.unpaidCount = orows.filter(function (r) { return r.toPay > 0.5; }).length;
      x.nightH = r2(orows.reduce(function (s, r) { return s + r.nightH; }, 0));
      var fms = D.users.filter(function (u) { return u.role === FOREMAN && eq(u.objectId, o.id); });
      x.foreman = fms.map(function (u) { return u.name; }).join(', ');
      x.foremen = fms.map(function (u) { var c = cashOf(D, u.tgId); return { tgId: u.tgId, name: u.name, balance: c.balance, pending: c.pending }; });
      x.cash = r2(x.foremen.reduce(function (s, f) { return s + f.balance; }, 0));
      x.inTransit = r2(x.foremen.reduce(function (s, f) { return s + f.pending; }, 0));
      x.transferred = r2(D.transfers.filter(function (t) { return eq(t.objectId, o.id) && t.month === month; }).reduce(function (s, t) { return s + (+t.amount || 0); }, 0));
      x.needTransfer = r2(Math.max(0, x.toPay - x.cash - x.inTransit));
      x.tz = o.tz || ''; x.localToday = todayOf(o.id);
      x.expenses = r2((D.expenses || []).filter(function (e) { return eq(e.objectId, o.id) && monthOf(e.date) === month && e.status !== REJECTED; }).reduce(function (s, e) { return s + (+e.amount || 0); }, 0));
      x.piece = r2(orows.reduce(function (s, r) { return s + (r.piece || 0); }, 0));
      return x;
    });
    var t = totalsOf(rows);
    var headcount = objList.reduce(function (s, o) { return s + o.headcount; }, 0);
    var present = objList.reduce(function (s, o) { return s + o.presentToday; }, 0);
    var lateToday = objList.reduce(function (s, o) { return s + o.lateToday; }, 0);
    var onSite = objList.reduce(function (s, o) { return s + o.onSite; }, 0);
    function top(key, cond) {
      return rows.filter(function (r) { return cond(r); }).sort(function (a, b) { return b[key] - a[key]; }).slice(0, 5)
        .map(function (r) { return { empId: r.empId, name: r.name, objectName: r.objectName, value: r[key], extra: key === 'late' ? r.lateMin : r.sum }; });
    }
    var emps = mapBy(D.employees), objsM = mapBy(D.objects), usersM = mapBy(D.users, 'tgId');
    var payList = D.payments.map(function (a) { return [a, 'Зарплата']; }).concat(D.advances.map(function (a) { return [a, 'Аванс']; }));
    var disputes = payList.filter(function (x) { return x[0].ack === ACK_NO; }).map(function (x) {
      var a = x[0]; return { id: a.id, kind: x[1], date: a.date, empId: a.empId, empName: a.empName, amount: +a.amount || 0, objectName: (objsM[a.objectId] || {}).name || '',
        payerName: (usersM[a.payerTgId] || {}).name || a.by || '', ackNote: a.ackNote || '', ackAt: a.ackAt || '' }; });
    var unacked = payList.filter(function (x) { var a = x[0], e = emps[a.empId];
      return !a.ack && e && e.tgId && a.date >= addDays(today, -45) && a.date <= addDays(today, -3); }).length;
    var newExp = (D.expenses || []).filter(function (e) { return !e.status; });
    return {
      month: month, today: today, isCurrent: isCur, lastDay: lastDay, days: n,
      closed: isClosed(D, month), archived: !!(D._archived && D._archived[month]),
      disputes: disputes, unacked: unacked,
      newExpenses: { count: newExp.length, sum: r2(newExp.reduce(function (s, e) { return s + (+e.amount || 0); }, 0)) },
      totals: {
        sum: t.sum, hours: t.hours, ot: t.ot, nightH: t.nightH, nights: t.nights, advance: t.advance, bonus: t.bonus, deduction: t.deduction, toPay: t.toPay, paid: t.paid, accrued: t.accrued,
        headcount: headcount, presentToday: present, onSite: onSite, lateToday: lateToday,
        late: t.late, absent: t.absent, manDays: t.days,
        attendance: (t.days + t.absent) ? r2(t.days / (t.days + t.absent)) : 0,
        avgHours: t.days ? r2(t.hours / t.days) : 0,
        otShare: t.hours ? r2(t.ot / t.hours) : 0,
        avgRate: t.hours ? r2(t.sum / t.hours) : 0,
        prevSum: r2(prevSum), noRate: t.noRate, noOut: t.noOut, liveSum: t.liveSum, liveH: t.liveH,
        dups: D._dups || 0, piece: t.piece,
        expenses: r2(objList.reduce(function (s, o) { return s + o.expenses; }, 0)),
        needTransfer: r2(objList.reduce(function (s, o) { return s + o.needTransfer; }, 0)),   // руководителю осталось передать бригадирам
        cash: r2(objList.reduce(function (s, o) { return s + o.cash; }, 0)),                   // у бригадиров на руках
        inTransit: r2(objList.reduce(function (s, o) { return s + o.inTransit; }, 0))           // передано, ждёт подтверждения
      },
      noRateList: rows.filter(function (r) { return r.noRate && r.active; }).slice(0, 8).map(function (r) { return { empId: r.empId, name: r.name, objectName: r.objectName }; }),
      noOutList: rows.filter(function (r) { return r.noOut; }).slice(0, 8).map(function (r) { return { empId: r.empId, name: r.name, objectName: r.objectName, value: r.noOut }; }),
      objects: objList, daily: daily, status: status, hr: hrSummary(D, month, function () { return true; }),
      topOT: top('ot', function (r) { return r.ot > 0; }),
      topLate: top('late', function (r) { return r.late > 0; }),
      topAbsent: top('absent', function (r) { return r.absent > 0; })
    };
  }

  function hrSummary(D, month, filter) {
    var ev = (D.hr || []).filter(function (h) { return monthOf(h.date) === month && filter(h.objectId); })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var objs = mapBy(D.objects), reasons = {};
    ev.forEach(function (h) { if (h.action === 'Удалён') reasons[h.reason] = (reasons[h.reason] || 0) + 1; });
    return {
      hired: ev.filter(function (h) { return h.action === 'Принят' || h.action === 'Восстановлен'; }).length,
      dismissed: ev.filter(function (h) { return h.action === 'Удалён'; }).length,
      transferred: ev.filter(function (h) { return h.action === 'Переведён'; }).length,
      reasons: reasons,
      events: ev.slice(0, 10).map(function (h) { var x = JSON.parse(JSON.stringify(h)); x.objectName = (objs[h.objectId] || {}).name || h.objectId; return x; })
    };
  }

  /* ---------- заявки на доступ (вызывается для неизвестных пользователей) ---------- */

    var D = store.data, id = String(u.id);
    if (find(D.requests, function (r) { return r.tgId === id; })) return;

  /* ---------- выгрузка ---------- */

    if (withPay) h1 = h1.concat(['Часы по ставке, ₽', 'Сверхурочные, ₽', 'Ночные доплаты, ₽', 'Доплата за бригадирство, ₽', 'Сдельно, ₽', 'Начислено, ₽', 'Начислено 1–15, ₽', 'Премия, ₽', 'Удержание, ₽', 'Аванс, ₽', 'Выплачено, ₽', 'Осталось выплатить, ₽']);

    sheets.push({ name: 'Табель', header: h2, rows: rows.map(function (r) {

    rows.forEach(function (r) {

      o.n++; o.days += r.days; o.hours += r.hours; o.ot += r.ot; o.sum += r.accrued; o.advance += r.advance + r.paid; o.toPay += Math.max(0, r.toPay);

    if (withPay) h4.splice(11, 0, 'Сумма, ₽');

      if (withPay) a.splice(11, 0, r.sum);

    if (withPay) {

      (D.payments || []).forEach(function (a) { if (a.month === month && filter(a.objectId)) pays.push([a.date, 'Зарплата', a]); });

      }) });

      if (ex.length) sheets.push({ name: 'Расходы', header: ['Дата', 'Объект', 'Кто потратил', 'Статья', 'Сумма, ₽', 'Комментарий', 'Чек', 'Проверка'], rows: ex.map(function (x) {

  /* ---------- API ---------- */
  function handle(action, p, ctx, store) {
    var D = store.data; p = p || {};
    if (!D._prepared) { prepare(D); D._prepared = true; }
    if (ROLE_ACTIONS[ctx.role]) need(ROLE_ACTIONS[ctx.role].indexOf(action) >= 0, 'Это действие вам недоступно');
    var isFm = ctx.role === FOREMAN, isSenior = ctx.role === SENIOR;
    var objs = mapBy(D.objects);
    function tzOf(objId) { var o = objs[objId]; return (o && o.tz) || ''; }
    function clockOf(objId, ts) { return store.clock ? store.clock(tzOf(objId), ts) : store.now(); }   // местное время объекта
    // «сейчас» для пользователя: у бригадира — время его объекта, у руководителя — время сервера
    var now = !isBoss(ctx) && ctx.objectId ? clockOf(ctx.objectId) : store.now();
    D._today = now.date; D._now = now.time;
    function epochNow() { return store.epoch ? store.epoch() : Date.now(); }
    function myCash() { return cashOf(D, ctx.tgId); }
    function canPayStaff() { return CFG.payScheme === 'direct' ? isBoss(ctx) : isFm; }
    function notify(tgId, text) { if (CFG.notify && store.notify && tgId && !eq(tgId, ctx.tgId)) store.notify(String(tgId), text); }
    function notifyBosses(text) { D.users.forEach(function (u) { if (u.role === BOSS) notify(u.tgId, text); }); }
    function myCardObj() {
      var cs = D.employees.filter(function (e) { return e.tgId && eq(e.tgId, ctx.tgId); });
      return find(cs, function (e) { return e.active; }) || cs[cs.length - 1] || null;
    }
    function crewOf(e) { return e.crew === NIGHT ? NIGHT : DAY; }
    function lockMsg(date) {
      if (isClosed(D, monthOf(date))) return 'Месяц ' + monthOf(date).split('-').reverse().join('.') + ' закрыт руководителем — изменения запрещены';
      return 'Этот день уже закрыт для изменений';
    }
    function closedList() { return D.closed.map(function (c) { return { month: c.month, closedAt: c.closedAt, by: c.by, archived: !!D._archived[c.month] }; }).sort(function (a, b) { return a.month < b.month ? 1 : -1; }); }
    function emp(id) { var e = find(D.employees, function (x) { return eq(x.id, id); }); need(e, 'Сотрудник не найден'); need(canSee(ctx, e.objectId), 'Нет доступа к этому сотруднику'); return e; }
    function recOf(empId, date) { return find(D.records, function (r) { return eq(r.empId, empId) && r.date === date; }); }
    function editable(date) {
      if (isClosed(D, monthOf(date))) return false;                  // закрытый месяц не меняет никто
      if (isBoss(ctx)) return true;
      if (isSenior) return date <= now.date && date >= addDays(now.date, -1);
      return date <= now.date && date >= addDays(now.date, -CFG.foremanEditDays);
    }
    function visibleFilter(objId) { return function (o) { return canSee(ctx, o) && (!objId || eq(o, objId)); }; }
    function save(rec, isNew) {

        return dashboard(D, p.month || monthOf(now.date), now.date, function (oid) { return clockOf(oid).date; });

      case 'employees':
        return D.employees.filter(function (e) { return canSee(ctx, e.objectId); }).map(function (e) {
          var x = JSON.parse(JSON.stringify(e)); if (!paySeen(ctx)) delete x.rate; x.objectName = (objs[e.objectId] || {}).name; return x;
        });

      case 'saveEmployee': {
        var boss = isBoss(ctx);
        var x = p.id ? emp(p.id) : null, isNewE = !x;
        need(String(p.name || '').trim(), 'Укажите ФИО');
        var objId = boss ? p.objectId : (x ? x.objectId : ctx.objectId);
        need(objs[objId], 'Выберите объект');
        if (isNewE) need(String(p.reason || '').trim(), 'Укажите основание приёма');
        if (isNewE && p.reason === 'Другое') need(String(p.comment || '').trim(), 'Опишите основание приёма');
        var canRate = boss || (isNewE && CFG.foremanSetsRate);
        if (canRate) need(+p.rate > 0, 'Укажите ставку за час');
        need(!canRate || +p.rate <= MAX_RATE, 'Ставка выглядит неверной: больше ' + MAX_RATE + ' ₽ в час');
        need(String(p.name).trim().length <= 100, 'Слишком длинное ФИО');
        need(!p.norm || (+p.norm > 0 && +p.norm <= 24), 'Норма часов в день — от 1 до 24');
        need(!p.otk || (+p.otk >= 1 && +p.otk <= 5), 'Коэффициент сверхурочных — от 1 до 5');
        var oldObj = x ? x.objectId : '';
        x = x || { id: 'E' + store.uid(), active: true, hiredAt: p.date || now.date, dismissedAt: '', dismissReason: '', norm: 8, otk: 1.5, rate: 0 };
        x.name = String(p.name).trim(); x.position = String(p.position || '').trim();
        x.phone = CFG.storePhones ? String(p.phone || '').trim().slice(0, 30) : '';      // без согласия телефоны не храним
        if (p.crew === NIGHT || p.crew === DAY) x.crew = p.crew; else if (!x.crew) x.crew = DAY;
        if (boss && p.leadType !== undefined) {
          need(!p.leadType || LEAD_TYPES[p.leadType], 'Неизвестный вид доплаты');
          need(!p.leadType || (+p.leadAmount >= 0 && +p.leadAmount <= MAX_MONEY), 'Неверная сумма доплаты');
          x.leadType = p.leadType || ''; x.leadAmount = p.leadType ? r2(p.leadAmount) : 0;
        }
        if (p.tgId !== undefined && String(p.tgId || '') !== String(x.tgId || '')) {    // Telegram ID сотрудника — для его личного кабинета
          var newTg = String(p.tgId || '').trim();
          need(!newTg || /^\d{3,15}$/.test(newTg), 'Telegram ID — это число, например 123456789');
          var other = newTg ? find(D.employees, function (z) { return eq(z.tgId, newTg) && !eq(z.id, x.id); }) : null;
          need(!other, 'Этот Telegram ID уже указан в карточке «' + (other && other.name) + '»');
          var lead = x.tgId && find(D.users, function (u) { return eq(u.tgId, x.tgId) && (u.role === FOREMAN || u.role === BOSS); });
          var usr = newTg && find(D.users, function (u) { return eq(u.tgId, newTg) && (u.role === FOREMAN || u.role === BOSS); });
          if (!boss) { need(!lead, 'Telegram ID бригадира меняет руководитель'); need(!usr, 'Это Telegram ID руководителя или бригадира'); }
          x.tgId = newTg;
          var rqx = newTg && find(D.requests || [], function (z) { return eq(z.tgId, newTg); });
          if (rqx) store.remove('requests', rqx);
          if (newTg) notify(newTg, 'Вам открыт личный кабинет: часы, начисления и выплаты. Откройте приложение в боте.');
        }
        if (!boss && x.tgId && eq(x.tgId, ctx.tgId)) need(!p.rate || +p.rate === +x.rate, 'Свою ставку меняет только руководитель');
        if (canRate) x.rate = +p.rate;
        if (boss) { x.norm = +p.norm || 8; x.otk = +p.otk || 1.5; }
        x.objectId = objId;
        if (isNewE) store.insert('employees', x); else store.update('employees', x);
        if (!isNewE && +x.rate > 0) {                     // ставку указали позже — досчитываем дни, где её не было
          D.records.forEach(function (r) { if (eq(r.empId, x.id) && !(+r.rate > 0) && !isClosed(D, monthOf(r.date))) { r.rate = x.rate; calcRecord(r, objs[r.objectId]); store.update('records', r); } });
        }
        if (isNewE) hrLog(x, 'Принят', p.reason, p.comment, p.date);
        else if (!eq(oldObj, objId)) hrLog(x, 'Переведён', p.reason || 'Перевод на другой объект',
          'С объекта «' + ((objs[oldObj] || {}).name || oldObj) + '» на «' + objs[objId].name + '»' + (p.comment ? '. ' + p.comment : ''));
        return { ok: true, id: x.id };
      }

      case 'removeEmployee': {
        var e7 = emp(p.empId);
        need(e7.active, 'Сотрудник уже удалён из бригады');

      }

      case 'restoreEmployee': {
        var e8 = emp(p.empId);
        need(!e8.active, 'Сотрудник и так в бригаде');
        e8.active = true; e8.dismissedAt = ''; e8.dismissReason = '';
        if (isBoss(ctx) && p.objectId && objs[p.objectId]) e8.objectId = p.objectId;
        store.update('employees', e8);
        hrLog(e8, 'Восстановлен', p.reason || 'Возврат в бригаду', p.comment);
        return { ok: true };
      }

      case 'access':
        need(isBoss(ctx) || isFm, 'Только руководитель управляет объектами и доступом');
        return accessView();

      case 'saveObject': {
        need(isBoss(ctx), 'Только руководитель управляет объектами');
        need(String(p.name || '').trim(), 'Укажите название объекта');
        need(!p.shiftStart || isTime(p.shiftStart), 'Начало смены в формате ЧЧ:ММ');
        var o = p.id ? find(D.objects, function (z) { return eq(z.id, p.id); }) : null, isNewO = !o;
        if (isNewO) {
          var nmax = 0; D.objects.forEach(function (z) { var mm = /(\d+)$/.exec(z.id); if (mm && +mm[1] > nmax) nmax = +mm[1]; });

        need(!p.nightStart || isTime(p.nightStart), 'Начало ночной смены в формате ЧЧ:ММ');
        need(!p.tz || TZ_IDS.indexOf(p.tz) >= 0, 'Неизвестный часовой пояс');
        o.tz = p.tz || o.tz || '';
        o.shiftStart = normTime(p.shiftStart || '08:00'); o.nightStart = normTime(p.nightStart || '20:00'); o.active = p.active === undefined ? true : !!p.active;
        if (isNewO) store.insert('objects', o); else store.update('objects', o);
        objs[o.id] = o;
        if (p.foremanTgId) assignUser({ tgId: p.foremanTgId, role: FOREMAN, objectId: o.id, name: p.foremanName });
        return accessView(o.id);
      }

      case 'saveUser':
        need(isBoss(ctx) || isFm, 'Только руководитель выдаёт доступ');
        assignUser(p);
        return accessView();

      case 'removeUser': {
        need(isBoss(ctx) || isFm, 'Только руководитель закрывает доступ');
        need(!eq(p.tgId, ctx.tgId), 'Нельзя закрыть доступ самому себе');
        var u2 = find(D.users, function (z) { return eq(z.tgId, p.tgId); });
        need(u2, 'Пользователь не найден');
        if (!isBoss(ctx)) need(u2.role === SENIOR && eq(u2.objectId, ctx.objectId), 'Бригадир может снять только старшего смены своего объекта');
        store.remove('users', u2);
        return accessView();
      }

      case 'dismissRequest': {
        need(isBoss(ctx), 'Только руководитель разбирает заявки');
        var rq = find(D.requests, function (z) { return eq(z.tgId, p.tgId); });
        if (rq) store.remove('requests', rq);
        return accessView();
      }

      case 'addAdvance': {
        var e4 = emp(p.empId);
        if (CFG.payScheme === 'direct') need(isBoss(ctx) || CFG.foremanGivesAdvance, 'Авансы вносит руководитель');
        else need(!isBoss(ctx), 'Авансы выдаёт бригадир из своей кассы. Передайте ему деньги во вкладке «Обзор»');
        var amtA = r2(p.amount);
        need(amtA > 0, 'Укажите сумму аванса');
        need(amtA <= MAX_MONEY, 'Слишком большая сумма');
        if (CFG.payScheme !== 'direct') {
          var cA = myCash();
          need(amtA <= cA.balance + 0.5, 'В кассе ' + cA.balance + ' ₽, а аванс ' + amtA + ' ₽. Попросите руководителя передать деньги' + (cA.pending ? ' или подтвердите получение ' + cA.pending + ' ₽' : ''));
        }
        need(editable(p.date || now.date) || isBoss(ctx), lockMsg(p.date || now.date));
        store.insert('advances', { id: store.uid(), date: p.date || now.date, empId: e4.id, empName: e4.name, objectId: e4.objectId,
          amount: amtA, comment: String(p.comment || '').slice(0, 200), by: ctx.name, payerTgId: ctx.tgId, ack: '', ackAt: '', ackNote: '' });
        if (e4.tgId && CFG.workerSeesPay) notify(e4.tgId, 'Вам выдан аванс ' + fmtMoney(amtA) + ' (' + ctx.name + ', ' + fdate(p.date || now.date) + '). Подтвердите получение в приложении.');
        return { ok: true, cash: isBoss(ctx) ? null : myCash() };
      }

      case 'payout': {
        need(canPayStaff(), CFG.payScheme === 'direct' ? 'Выплаты проводит руководитель' : 'Зарплату сотрудникам выплачивает бригадир. Передайте ему деньги во вкладке «Обзор»');
        var mp = p.month || monthOf(now.date), items = [].concat(p.items || []);
        need(items.length, 'Не выбраны сотрудники');
        var total = 0;
        var owe = {}; monthRows(D, mp, function () { return true; }, true).forEach(function (r) { owe[r.empId] = r; });
        items.forEach(function (it) {
          var a = r2(it.amount), w = owe[it.empId];
          need(a > 0 && a <= MAX_MONEY, 'Сумма выплаты должна быть больше нуля');
          need(w && a <= Math.max(0, w.toPay) + 0.5, (w ? w.name : 'Сотрудник') + ': к выплате за этот месяц ' + (w ? Math.max(0, w.toPay) : 0) + ' ₽ — больше выплатить нельзя');
          total += a;
        });
        if (CFG.payScheme !== 'direct') {
          var cP = myCash();
          need(total <= cP.balance + 0.5, 'В кассе ' + cP.balance + ' ₽, а к выплате ' + r2(total) + ' ₽. Не хватает ' + r2(total - cP.balance) + ' ₽' +
            (cP.pending ? '. Подтвердите получение ' + cP.pending + ' ₽ от руководителя' : '. Попросите руководителя передать деньги'));
        }
        items.forEach(function (it) {
          var ep = emp(it.empId);
          store.insert('payments', { id: store.uid(), date: p.date || now.date, month: mp, empId: ep.id, empName: ep.name, objectId: ep.objectId,
            amount: r2(it.amount), comment: String(p.comment || '').slice(0, 200), by: ctx.name, payerTgId: ctx.tgId, ack: '', ackAt: '', ackNote: '' });
          if (ep.tgId && CFG.workerSeesPay) notify(ep.tgId, 'Вам выплачена зарплата за ' + mp.split('-').reverse().join('.') + ': ' + fmtMoney(it.amount) + ' (' + ctx.name + '). Подтвердите получение в приложении.');
        });
        return { ok: true, count: items.length, total: r2(total), cash: isBoss(ctx) ? null : myCash() };
      }

      case 'cancelPayment': {
        var pay = find(D.payments, function (a) { return eq(a.id, p.id); }), kind = 'payments';
        if (!pay) { pay = find(D.advances, function (a) { return eq(a.id, p.id); }); kind = 'advances'; }
        need(pay, 'Выплата не найдена');
        need(isBoss(ctx) || (eq(pay.payerTgId, ctx.tgId) && editable(pay.date)), 'Отменить можно только свою выплату за последние ' + CFG.foremanEditDays + ' дня');
        need(isBoss(ctx) || pay.ack !== ACK_OK, 'Сотрудник уже подтвердил получение — отменить может только руководитель');
        store.remove(kind, pay);
        return { ok: true };
      }

      case 'transfer': {
        need(isBoss(ctx), 'Передавать деньги бригадирам может только руководитель');
        need(objs[p.objectId], 'Выберите объект');
        var fm = find(D.users, function (u) { return u.role === FOREMAN && eq(u.objectId, p.objectId) && (!p.foremanTgId || eq(u.tgId, p.foremanTgId)); });
        need(fm, 'На объекте нет бригадира — назначьте его во вкладке «Объекты»');
        var amtT = r2(p.amount);
        need(amtT > 0, 'Укажите сумму');
        need(amtT <= MAX_MONEY, 'Слишком большая сумма');
        store.insert('transfers', { id: store.uid(), date: p.date || now.date, month: p.month || monthOf(now.date), objectId: p.objectId,
          foremanTgId: fm.tgId, foremanName: fm.name, amount: amtT, comment: String(p.comment || '').slice(0, 200), by: ctx.name,
          status: SENT, confirmedAt: '' });
        notify(fm.tgId, 'Руководитель передал вам ' + fmtMoney(amtT) + ' (' + objs[p.objectId].name + '). Подтвердите получение во вкладке «Бригада».');
        return { ok: true, foreman: fm.name, amount: amtT };
      }

      case 'confirmTransfer': {
        var tr = find(D.transfers, function (t) { return eq(t.id, p.id); });
        need(tr, 'Передача не найдена');
        need(eq(tr.foremanTgId, ctx.tgId), 'Подтвердить получение может только сам бригадир');
        if (tr.status !== RECEIVED) {
          tr.status = RECEIVED; tr.confirmedAt = now.date + ' ' + now.time; store.update('transfers', tr);
          notify(D.users.filter(function (u) { return u.role === BOSS && eq(u.name, tr.by); }).map(function (u) { return u.tgId; })[0], ctx.name + ' подтвердил получение ' + fmtMoney(tr.amount) + '.');
        }
        return { ok: true, cash: cashView(D, ctx.tgId) };
      }

      case 'cancelTransfer': {
        need(isBoss(ctx), 'Отменить передачу может только руководитель');
        var tr2 = find(D.transfers, function (t) { return eq(t.id, p.id); });
        need(tr2, 'Передача не найдена');
        need(tr2.status !== RECEIVED, 'Бригадир уже подтвердил получение — отменить нельзя');
        store.remove('transfers', tr2);
        return { ok: true };
      }

      case 'cash':
        if (isBoss(ctx)) {
          need(!p.tgId || find(D.users, function (u) { return eq(u.tgId, p.tgId); }), 'Бригадир не найден');
          if (p.tgId) return cashView(D, p.tgId);
          return D.users.filter(function (u) { return u.role === FOREMAN; }).map(function (u) {
            var c = cashOf(D, u.tgId); c.tgId = u.tgId; c.name = u.name; c.objectId = u.objectId; c.objectName = (objs[u.objectId] || {}).name || ''; return c; });
        }
        return cashView(D, ctx.tgId);

      case 'addAdjustment': {
        need(isBoss(ctx), 'Премии и удержания вносит руководитель');
        var e5 = emp(p.empId);
        need(+p.bonus > 0 || +p.deduction > 0, 'Укажите премию или удержание');
        need(!isClosed(D, p.month || monthOf(now.date)), lockMsg((p.month || monthOf(now.date)) + '-01'));
        need((+p.bonus || 0) <= MAX_MONEY && (+p.deduction || 0) <= MAX_MONEY, 'Слишком большая сумма');
        store.insert('adjustments', { id: store.uid(), month: p.month || monthOf(now.date), empId: e5.id, empName: e5.name, objectId: e5.objectId,
          bonus: r2(p.bonus), deduction: r2(p.deduction), comment: String(p.comment || '').slice(0, 200), by: ctx.name });
        return { ok: true };
      }


      /* ----- личный кабинет: мои часы, начисления, выплаты ----- */
      case 'me': {
        var card = myCardObj();
        need(card, 'Ваша карточка сотрудника не найдена. Попросите бригадира указать ваш Telegram ID в карточке');
        var mm = p.month || monthOf(now.date), seePay = CFG.workerSeesPay || paySeen(ctx);
        var rowM = monthRows(D, mm, function () { return true; }, true).filter(function (r) { return eq(r.empId, card.id); })[0] || null;
        var recsM = D.records.filter(function (r) { return eq(r.empId, card.id) && monthOf(r.date) === mm; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; })
          .map(function (r) { var x = JSON.parse(JSON.stringify(r)); delete x._row;
            x.noOut = x.status === 'Явка' && !!x.in && !x.out && (x.date < addDays(now.date, -1) || (x.date === addDays(now.date, -1) && x.shift !== NIGHT)); return x; });
        var usersM = mapBy(D.users, 'tgId');
        function payV(a, kind) { return { id: a.id, kind: kind, date: a.date, month: a.month || '', amount: +a.amount || 0, comment: a.comment || '', by: (usersM[a.payerTgId] || {}).name || a.by || '', ack: a.ack || '', ackNote: a.ackNote || '', ackAt: a.ackAt || '' }; }
        var paysM = D.payments.filter(function (a) { return eq(a.empId, card.id) && a.month === mm; }).map(function (a) { return payV(a, 'Зарплата'); })
          .concat(D.advances.filter(function (a) { return eq(a.empId, card.id) && monthOf(a.date) === mm; }).map(function (a) { return payV(a, 'Аванс'); }));
        var toAckL = D.payments.map(function (a) { return [a, 'Зарплата']; }).concat(D.advances.map(function (a) { return [a, 'Аванс']; }))
          .filter(function (x) { return eq(x[0].empId, card.id) && x[0].ack !== ACK_OK && x[0].date >= addDays(now.date, -120); })
          .map(function (x) { return payV(x[0], x[1]); }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
        var workM = (D.work || []).filter(function (w) { return eq(w.empId, card.id) && monthOf(w.date) === mm; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; })
          .map(function (w) { return { date: w.date, name: w.name, unit: w.unit, qty: +w.qty, price: +w.price, sum: +w.sum }; });
        var adjM = D.adjustments.filter(function (a) { return eq(a.empId, card.id) && a.month === mm; }).map(function (a) { return { bonus: +a.bonus || 0, deduction: +a.deduction || 0, comment: a.comment || '' }; });
        var infoM = { id: card.id, name: card.name, position: card.position, objectId: card.objectId, objectName: (objs[card.objectId] || {}).name || '', crew: crewOf(card), active: card.active,
          rate: +card.rate || 0, norm: +card.norm || 8, otk: +card.otk || 1.5, leadType: card.leadType || '', leadAmount: +card.leadAmount || 0 };
        if (!seePay) { delete infoM.rate; delete infoM.leadAmount; if (rowM) stripPay(rowM); recsM.forEach(function (r) { delete r.sum; delete r.rate; }); paysM = []; toAckL = []; adjM = []; workM.forEach(function (w) { delete w.price; delete w.sum; }); }
        return { month: mm, days: dim(mm), today: now.date, emp: infoM, row: rowM, records: recsM, payments: paysM, toAck: toAckL, work: workM, adjustments: adjM,
          nightK: CFG.nightK, seePay: seePay, closed: isClosed(D, mm), archived: !!D._archived[mm] };
      }

      case 'ackPayment': {
        var cardA = myCardObj();
        need(cardA, 'Ваша карточка сотрудника не найдена');
        need(CFG.workerSeesPay || paySeen(ctx), 'Подтверждение выплат выключено');
        var pa = find(D.payments, function (a) { return eq(a.id, p.id); }), kindA = 'payments', nameA = 'зарплату';
        if (!pa) { pa = find(D.advances, function (a) { return eq(a.id, p.id); }); kindA = 'advances'; nameA = 'аванс'; }
        need(pa && eq(pa.empId, cardA.id), 'Это не ваша выплата');
        need(pa.ack !== ACK_OK, 'Получение уже подтверждено');
        if (p.ok) { pa.ack = ACK_OK; pa.ackNote = ''; }
        else { pa.ack = ACK_NO; pa.ackNote = String(p.note || '').trim().slice(0, 200); }
        pa.ackAt = now.date + ' ' + now.time;
        store.update(kindA, pa);
        if (!p.ok) {
          var txt = '⚠ ' + cardA.name + ' (' + ((objs[cardA.objectId] || {}).name || '') + ') сообщает, что НЕ получил ' + nameA + ' ' + fmtMoney(pa.amount) + ' от ' + fdate(pa.date) +
            (pa.ackNote ? ': «' + pa.ackNote + '»' : '') + '. Выплату записал: ' + (pa.by || '—') + '.';
          notifyBosses(txt); notify(pa.payerTgId, txt);
        }
        return { ok: true, ack: pa.ack };
      }

      /* ----- закрытие месяца ----- */
      case 'closeMonth': {
        need(isBoss(ctx), 'Закрывает месяц руководитель');
        var cm = String(p.month || '');
        need(/^\d{4}-\d{2}$/.test(cm), 'Укажите месяц');

  /* ---------- напоминания и итоги дня (вызывается по расписанию раз в час) ----------
     clock(objId) — местные дата и время объекта, srv — дата и время сервера.
     Возвращает список { key, tgId, text }; key защищает от повторной отправки. */
  function reminders(D, clock, srv) {
    if (!D._prepared) { prepare(D); D._prepared = true; }

    if (!CFG.notify) return out;
    function hourOf(t) { return Math.floor((mins(t) || 0) / 60); }
    function names(list) { var n = list.slice(0, 8).map(function (e) { return e.name; }).join(', '); return n + (list.length > 8 ? ' и ещё ' + (list.length - 8) : ''); }
    D.objects.filter(function (o) { return o.active; }).forEach(function (o) {
      var c = clock(o.id), h = +String(c.time).slice(0, 2), y = addDays(c.date, -1);
      var fms = D.users.filter(function (u) { return u.role === FOREMAN && eq(u.objectId, o.id); });
      function to(crew) {
        var sn = D.users.filter(function (u) { return u.role === SENIOR && eq(u.objectId, o.id) && (u.crew === NIGHT ? NIGHT : DAY) === crew; });
        return (sn.length ? sn : []).concat(fms).map(function (u) { return u.tgId; });
      }
      var staff = D.employees.filter(function (e) { return e.active && eq(e.objectId, o.id) && !(e.hiredAt && e.hiredAt > c.date); });
      function rec(e, d) { return find(D.records, function (r) { return eq(r.empId, e.id) && r.date === d; }); }
      function push(kind, crew, text) { to(crew).forEach(function (id) { out.push({ key: c.date + ':' + kind + ':' + o.id + ':' + id, tgId: id, text: text }); }); }
      [[DAY, o.shiftStart || '08:00'], [NIGHT, o.nightStart || '20:00']].forEach(function (x) {
        var crew = x[0], list = staff.filter(function (e) { return (e.crew === NIGHT ? NIGHT : DAY) === crew; });
        if (!list.length || h !== hourOf(x[1]) + 1) return;
        var un = list.filter(function (e) { return !rec(e, c.date); });
        if (un.length) push('in' + crew, crew, o.name + ' · ' + (crew === NIGHT ? 'ночная' : 'дневная') + ' бригада: не отмечен приход у ' + un.length + ' из ' + list.length + ' — ' + names(un) + '.');
      });
      if (h === CFG.remindOutHour) {

        if (open.length) push('outDay', DAY, o.name + ': не отмечен уход у ' + open.length + ' — ' + names(open) + '. Без ухода часы не посчитаются.');
      }
      if (h === CFG.remindNightOutHour) {
        var openN = staff.filter(function (e) { var r = rec(e, y); return r && r.status === 'Явка' && r.in && !r.out && r.shift === NIGHT; });
        if (openN.length) push('outNight', NIGHT, o.name + ': ночная смена не закрыта у ' + openN.length + ' — ' + names(openN) + '. Отметьте уход на вкладке «Ночная бригада».');
      }

      var lines = [], acc = 0;
      D.objects.filter(function (o) { return o.active; }).forEach(function (o) {
        var d0 = clock(o.id).date, staff = D.employees.filter(function (e) { return e.active && eq(e.objectId, o.id); });
        var rs = D.records.filter(function (r) { return eq(r.objectId, o.id) && r.date === d0 && r.status === 'Явка'; });
        var late = rs.filter(function (r) { return r.late; }).length, noOut = rs.filter(function (r) { return r.in && !r.out && r.shift !== NIGHT; }).length;
        rs.forEach(function (r) { acc += +r.sum || 0; });

      });

      var text = 'Итоги дня ' + fdate(srv.date) + '\n' + lines.join('\n') + '\nНачислено за день по табелю: ~' + fmtMoney(acc) +
        (exToday.length ? '\nРасходы бригадиров сегодня: ' + fmtMoney(exToday.reduce(function (s, x) { return s + (+x.amount || 0); }, 0)) + ' (' + exToday.length + ')' : '') +
        (pend.length ? '\nПередачи ждут подтверждения: ' + pend.length + ' на ' + fmtMoney(pend.reduce(function (s, t) { return s + (+t.amount || 0); }, 0)) : '') +

/* Приводит ответ сервера к полному виду: если сервер старой версии не прислал поле, считаем его сами */

  if (r.toPay === undefined || isNaN(+r.toPay)) r.toPay = Math.round((r.accrued - r.advance - r.paid) * 100) / 100;
  if (r.baseSum === undefined) { r.baseH = r.hours - r.ot; r.baseSum = r.rate ? r.baseH * r.rate : r.sum; r.otSum = r.rate ? Math.max(0, r.sum - r.baseSum) : 0; r.nightSum = 0; }

function tile(l, v, n) { return '<div class="tile"><div class="lbl">' + l + '</div><div class="val">' + v + '</div><div class="note">' + n + '</div></div>'; }
function rankCard(title, list, val, sub) {
  if (!list.length) return '<div class="card"><h2>' + title + '</h2><div class="hint">За этот месяц нет</div></div>';
  var max = Math.max.apply(null, list.map(function (x) { return x.value; })) || 1;
  return '<div class="card"><h2>' + title + '</h2><div class="list rank">' + list.map(function (x) {
    return '<div class="row tap" data-emp="' + esc(x.empId) + '"><div class="main"><div class="name">' + esc(x.name) + '</div><div class="meta">' + esc(x.objectName) + (sub(x) ? ' · ' + sub(x) : '') + '</div><div class="bar"><i style="width:' + (x.value / max * 100) + '%"></i></div></div><div class="side"><div class="v">' + val(x) + '</div></div></div>';
  }).join('') + '</div></div>';
}

/* ---------- графики ---------- */
function niceStep(max, n) {
  var raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}
function barPath(x, y, w, h, r) {
  if (h <= 0) return ''; r = Math.min(r, w / 2, h);
  return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
}
function columnChart(box, cfg) {
  // cfg: n, stacks(i) -> [{v,color,label}], label(i), tip(i) -> html, refLine, fmtAxis, ticks
  function draw() {
    var W = Math.max(280, box.clientWidth), H = cfg.height || 190, L = 44, R = 6, T = 8, B = 22;
    var pw = W - L - R, ph = H - T - B, band = pw / cfg.n, bw = Math.max(3, Math.min(18, band * 0.64));
    var max = 0; for (var i = 0; i < cfg.n; i++) { var s = cfg.stacks(i).reduce(function (a, x) { return a + x.v; }, 0); if (s > max) max = s; }
    if (cfg.refLine) max = Math.max(max, cfg.refLine * 1.15);
    var step = niceStep(max || 1, 4), top = Math.ceil((max || 1) / step) * step, y = function (v) { return T + ph - v / top * ph; };
    var g = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(cfg.aria) + '">';
    for (var v = 0; v <= top + 1e-9; v += step) {
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1"' + (v ? ' stroke-dasharray="2 3"' : '') + '/>';
      g += '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + cfg.fmtAxis(v) + '</text>';
    }
    if (cfg.refLine) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(cfg.refLine) + '" y2="' + y(cfg.refLine) + '" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5 4"/>';
    g += '<rect class="hl" x="0" y="' + T + '" width="' + band + '" height="' + ph + '" fill="var(--fg)" opacity="0" rx="4"/>';
    for (var i2 = 0; i2 < cfg.n; i2++) {
      var x = L + i2 * band + (band - bw) / 2, acc = 0, st = cfg.stacks(i2).filter(function (s) { return s.v > 0; });
      st.forEach(function (s, k) {
        var y0 = y(acc + s.v), hh = y(acc) - y0, last = k === st.length - 1;
        g += last ? '<path d="' + barPath(x, y0, bw, hh, Math.min(4, bw / 2)) + '" fill="' + s.color + '"/>' : '<rect x="' + x + '" y="' + y0 + '" width="' + bw + '" height="' + hh + '" fill="' + s.color + '"/>';
        if (k > 0) g += '<rect x="' + x + '" y="' + (y(acc) - 1) + '" width="' + bw + '" height="2" fill="var(--surface)"/>';
        acc += s.v;
      });
      if (cfg.mark && cfg.mark(i2)) g += '<text x="' + (L + i2 * band + band / 2) + '" y="' + (T + ph - 4) + '" text-anchor="middle" style="font-size:9px">' + cfg.mark(i2) + '</text>';
      var lb = cfg.label(i2); if (lb) g += '<text x="' + (L + i2 * band + band / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + lb + '</text>';
    }
    g += '</svg><div class="tip" hidden></div>';
    box.innerHTML = g;
    var svg = box.querySelector('svg'), tip = box.querySelector('.tip'), hl = box.querySelector('.hl');
    function show(ev) {
      var r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width, i = Math.floor((sx - L) / band);
      if (i < 0 || i >= cfg.n) { hide(); return; }
      var html = cfg.tip(i); if (!html) { hide(); return; }
      hl.setAttribute('x', L + i * band); hl.setAttribute('opacity', '0.06');
      tip.innerHTML = html; tip.hidden = false;
      var bx = (L + i * band + band / 2) * r.width / W, tw = tip.offsetWidth, left = bx + 12;
      if (left + tw > r.width) left = bx - tw - 12; if (left < 0) left = 0;
      tip.style.left = left + 'px'; tip.style.top = '4px';
    }
    function hide() { tip.hidden = true; hl.setAttribute('opacity', '0'); }
    svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') hide(); });
  }
  draw();
  var w = box.clientWidth; var ro = new ResizeObserver(function () { if (Math.abs(box.clientWidth - w) > 4) { w = box.clientWidth; draw(); } }); ro.observe(box);
}
function dailyChart(box, d) {
  var objs = d.objects;
  columnChart(box, {
    n: d.days, height: 200, aria: 'Начисления по дням по объектам',
    stacks: function (i) { var x = d.daily[i]; return objs.map(function (o) { return { v: x.byObj[o.id] || 0, color: objColor(o.id) }; }); },
    label: function (i) { var dd = i + 1; return dd === 1 || dd % 5 === 0 ? dd : ''; },
    fmtAxis: compact,
    tip: function (i) {
      var x = d.daily[i]; if (!x.total) return '';
      return '<div class="t">' + fmtDay(x.date) + '</div>' + objs.map(function (o) {
        return x.byObj[o.id] ? '<div class="l"><span><i style="background:' + objColor(o.id) + '"></i>' + esc(o.name) + '</span><span>' + money(x.byObj[o.id]) + '</span></div>' : ''; }).join('') +
        '<div class="l" style="margin-top:3px;font-weight:600"><span>Всего · ' + x.present + ' чел.</span><span>' + money(x.total) + '</span></div>';
    }
  });
}

function drawDay(d) {

  var senior = S.init.me.role === 'Старший смены';
  if (senior) S.crew = S.init.me.crew || 'День';
  var crew = S.crew === 'Ночь' ? 'Ночь' : 'День', night = crew === 'Ночь';
  var rowsC = d.rows.filter(function (r) { return (r.emp.crew || 'День') === crew; });
  var cnt = { 'День': { t: 0, p: 0 }, 'Ночь': { t: 0, p: 0 } };
  d.rows.forEach(function (r) { var c = cnt[r.emp.crew || 'День']; c.t++; if (r.rec && r.rec.status === 'Явка') c.p++; });
  var s = { total: rowsC.length, present: 0, onSite: 0, left: 0, late: 0, unmarked: 0, absent: 0 };
  rowsC.forEach(function (x) { var r = x.rec; if (!r) s.unmarked++; else if (r.status === 'Явка') { s.present++; if (r.in && !r.out) s.onSite++; if (r.out) s.left++; if (r.late) s.late++; } else if (r.status === 'Прогул') s.absent++; });
  var h = '<div class="stack"><div id="qbar" hidden></div>';
  if (senior) h += '<div class="hint" style="font-size:13px">Вы старший ' + (night ? 'ночной' : 'дневной') + ' смены: отмечаете приход и уход своей бригады.</div>';
  else h += '<div class="shiftsw" role="tablist" aria-label="Бригада"><button data-crew="День" role="tab" aria-pressed="' + !night + '">' + ic('sun') + 'Дневная бригада <span class="num">' + cnt['День'].p + '/' + cnt['День'].t + '</span></button>' +
    '<button data-crew="Ночь" role="tab" aria-pressed="' + night + '">' + ic('moon') + 'Ночная бригада <span class="num">' + cnt['Ночь'].p + '/' + cnt['Ночь'].t + '</span></button></div>';
  var oneObj = S.obj || (!S.init.me.isBoss && S.init.me.objectId);

  v.querySelectorAll('[data-out]').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); mark([b.dataset.out], 'out', b); }; });

    var row = d.rows.filter(function (x) { return x.emp.id === el.dataset.edit; })[0]; openRecord(row.emp, row.rec, d.date, d.editable && !senior, function () { renderToday(); }); }; });

      unm.map(function (r) { return '<div class="row"><div class="main"><div class="name">' + esc(r.emp.name) + '</div><div class="meta">' + esc(r.emp.position || '') + '</div></div></div>'; }).join('') +
      '</div><button class="btn block" id="cAll">Отметить · ' + unm.length + ' ' + plural(unm.length, 'человек', 'человека', 'человек') + '</button><button class="btn sec block" id="cCancel">Отмена</button>', function () {
      $('#cCancel').onclick = closeSheet;
      $('#cAll').onclick = function () { closeSheet(); mark(unm.map(function (r) { return r.emp.id; }), 'in'); };
    });

}
function mark(ids, action, btn, onDate) {
  if (S.init.me.role === 'Старший смены') S.crew = S.init.me.crew || 'День';
  var date = onDate || S.date, shift = S.crew === 'Ночь' ? 'Ночь' : 'День';
  if (DEMO) {
    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    api('mark', { empIds: ids, action: action, date: date, viewDate: S.date, objectId: S.obj, shift: shift, ts: Date.now() }).then(function (d) {
      haptic('success'); toast(action === 'in' ? 'Приход отмечен' : 'Уход отмечен'); drawDay(d);
    }).catch(function (e) { fail(e); renderToday(); });
    return;
  }
  var sn = serverNow();
  var it = { rid: rid(), action: action, empIds: ids, date: date, viewDate: S.date, shift: shift, objectId: S.obj, at: Date.now(), ts: nowTs() };          // для ночной смены со вчера — тоже текущее время          // время нажатия по часам сервера — даже если отправится позже
  Q.items.push(it); qSave();
  haptic('success'); toast(action === 'in' ? 'Приход отмечен' : 'Уход отмечен');
  if (S.day) drawDay(S.day);                          // сразу показываем, не дожидаясь сервера
  forget('month'); forget('dashboard');
  qRun();
}

/* ---------- карточка отметки ---------- */
function openRecord(emp, rec, date, editable, after) {
  var st = rec ? rec.status : 'Явка', sh0 = rec && rec.shift === 'Ночь' ? 'Ночь' : (rec ? 'День' : (emp.crew || S.crew || 'День'));
  var h = '<div><h3>' + esc(emp.name) + '</h3><div class="muted">' + fmtDay(date) + '</div></div>';
  if (rec && rec.status === 'Явка' && rec.out) {
    h += '<div class="receipt"><div><span>Отработано</span><span>' + hrs(rec.hours) + '</span></div>' + (rec.ot ? '<div><span>Из них сверхурочно</span><span>' + hrs(rec.ot) + '</span></div>' : '') + (rec.nightH ? '<div><span>Из них ночных (22–6)</span><span>' + hrs(rec.nightH) + '</span></div>' : '') +
      (rec.sum !== undefined ? '<div><span>Начислено за день</span><span>' + money(rec.sum) + '</span></div>' : '') + (rec.late ? '<div><span>Опоздание</span><span>' + rec.late + ' мин</span></div>' : '') + '</div>';
  }
  if (rec && rec.comment) h += '<div class="notice" style="border-color:' + (+rec.edited ? 'var(--warn)' : 'var(--line)') + ';background:' + (+rec.edited ? 'var(--warn-bg)' : 'var(--surface-2)') + ';font-size:13px">' + esc(rec.comment) + '</div>';
  if (editable) {
    h += '<div class="seg" role="group" aria-label="Статус дня">' + Core.STATUSES.map(function (s) {
      return '<button type="button" data-st="' + s.id + '" aria-pressed="' + (s.id === st) + '"><b>' + s.code + '</b>' + s.id + '</button>'; }).join('') + '</div>';
    h += '<div id="shBox" class="shiftsw"' + (st !== 'Явка' ? ' hidden' : '') + '><button type="button" data-sh="День" aria-pressed="' + (sh0 === 'День') + '">' + ic('sun') + 'Дневная</button><button type="button" data-sh="Ночь" aria-pressed="' + (sh0 === 'Ночь') + '">' + ic('moon') + 'Ночная</button></div>';
    h += '<div id="timeBox" class="three"' + (st !== 'Явка' ? ' hidden' : '') + '>' +
      '<div class="field"><label for="fIn">Приход</label><input id="fIn" type="time" value="' + (rec && rec.in || (date === S.init.today ? '' : '08:00')) + '"></div>' +
      '<div class="field"><label for="fOut">Уход</label><input id="fOut" type="time" value="' + (rec && rec.out || '') + '"></div>' +
      '<div class="field"><label for="fLunch">Обед, мин</label><input id="fLunch" type="number" inputmode="numeric" min="0" max="600" value="' + (rec ? rec.lunch : 60) + '"></div></div>';
    h += '<div class="err" id="fErr" hidden></div><button class="btn block" id="fSave">Сохранить</button>';
  } else h += '<div class="hint">' + (S.init.me.role === 'Старший смены' ? 'Исправить время может бригадир.' : isClosedM(date.slice(0, 7)) ? 'Месяц закрыт руководителем — изменения запрещены.' : 'Этот день закрыт для изменений.') + '</div>';
  if (S.init.me.role !== 'Старший смены') h += '<button class="btn ghost" id="fCard">Карточка сотрудника за месяц →</button>';
  openSheet(h, function (sh) {
    sh.querySelectorAll('[data-st]').forEach(function (b) { b.onclick = function () {
      st = b.dataset.st; sh.querySelectorAll('[data-st]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
      $('#timeBox').hidden = st !== 'Явка'; $('#shBox').hidden = st !== 'Явка'; }; });
    sh.querySelectorAll('[data-sh]').forEach(function (b) { b.onclick = function () {
      sh0 = b.dataset.sh; sh.querySelectorAll('[data-sh]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); }; });
    var fc = $('#fCard'); if (fc) fc.onclick = function () { closeSheet(); openEmployee(emp.id); };
    var sv = $('#fSave');
    if (sv) sv.onclick = function () {
      var p = { empId: emp.id, date: date, status: st, objectId: S.obj, shift: sh0, viewDate: S.tab === 'today' ? S.date : date };
      if (st === 'Явка') { p.in = $('#fIn').value; p.out = $('#fOut').value; p.lunch = $('#fLunch').value; }
      if (st === 'Явка' && !p.in) { var er = $('#fErr'); er.textContent = 'Укажите время прихода'; er.hidden = false; return; }
      sv.disabled = true;
      api('edit', p).then(function (d) { closeSheet(); haptic('success'); toast('Сохранено'); forget(); if (d && d.rows) cput(ckey('day', { date: d.date, objectId: S.obj }), d); after && after(); })
        .catch(function (e) { sv.disabled = false; var er = $('#fErr'); er.textContent = e.message; er.hidden = false; });
    };
  });
}

/* ================= ТАБЕЛЬ (месяц) ================= */

    if (!d.rows.length) { $('#view').innerHTML = '<div class="card empty">Нет сотрудников</div>'; return; }

    var h = (isClosedM(d.month) ? '<div style="margin-bottom:12px">' + closedBanner(d.month) + '</div>' : '') + '<div class="card"><div class="mx-wrap"><table class="mx"><thead><tr><th class="nm">Сотрудник</th>';
    for (var i = 1; i <= d.days; i++) { var we = d.dows[i - 1] === 0 || d.dows[i - 1] === 6; h += '<th class="d' + (we ? ' we' : '') + (i === todayDay ? ' td' : '') + '">' + i + '<small>' + DOW[d.dows[i - 1]] + '</small></th>'; }

          else { txt = '<span class="cd' + (c.s === 'Прогул' ? ' pr' : '') + '">' + Core.CODE[c.s] + '</span>'; }
        }

    });
    h += '</tbody></table></div><div class="mx-legend"><span><b>8</b> — часы</span><span><b>Я</b>…на объекте</span><span><b>В</b> выходной</span><span><b>ОТ</b> отпуск</span><span><b>Б</b> больничный</span><span><b>ПР</b> прогул</span><span><b style="color:var(--s7)">11</b> ночная смена</span><span><b style="color:var(--crit)">!</b> не отмечен уход</span><span><b>★</b> бригадир</span>' +
      '<span><i class="dot" style="background:var(--warn);width:6px;height:6px"></i> опоздание</span><span><i class="dot" style="background:var(--ot-bg);border-radius:2px;border:1px solid var(--line)"></i> сверхурочные</span></div></div>';
    h += '<div class="card" style="margin-top:12px"><div class="strip"><span>Сотрудников <b>' + d.totals.count + '</b></span><span>Человеко-дней <b>' + d.totals.days + '</b></span><span>Часов <b>' + nf0.format(d.totals.hours) + '</b></span><span>Сверхурочных <b>' + nf0.format(d.totals.ot) + '</b></span><span>Опозданий <b>' + d.totals.late + '</b></span></div></div>';

}
