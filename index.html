<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Табель бригад</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Прорабский журнал: плотные списки, моноширинные цифры, коды табеля Т-13 (Я, В, ОТ, Б, ПР). */
:root {
  --bg: #eef0ec; --surface: #ffffff; --surface-2: #f4f5f2; --fg: #16191b; --muted: #596066; --hint: #868c91;
  --line: #dde1db; --accent: #146c5f; --accent-fg: #ffffff; --accent-weak: #dcece8;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --good-bg: #e2f4e2; --warn-bg: #fdf1d6; --crit-bg: #f9e1e1; --ot-bg: #fbe8dc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --surface: #1a1e21; --surface-2: #22272a; --fg: #eef0f1; --muted: #a5abaf; --hint: #7d8488;
    --line: #2d3337; --accent: #3fb6a3; --accent-fg: #06211c; --accent-weak: #173430;
    --good-bg: #16301a; --warn-bg: #3a2e12; --crit-bg: #3b1d1d; --ot-bg: #3a2519;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --surface: #1a1e21; --surface-2: #22272a; --fg: #eef0f1; --muted: #a5abaf; --hint: #7d8488;
  --line: #2d3337; --accent: #3fb6a3; --accent-fg: #06211c; --accent-weak: #173430;
  --good-bg: #16301a; --warn-bg: #3a2e12; --crit-bg: #3b1d1d; --ot-bg: #3a2519;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .hint { color: var(--hint); }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; }

/* demo bar */
#demo { background: var(--accent-weak); color: var(--fg); font-size: 13px; }
#demo .wrap { display: flex; gap: 8px; align-items: center; padding-block: 8px; flex-wrap: wrap; }
#demo b { font-weight: 600; }
#demo select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13px; max-width: 100%; }

/* top */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
#top .wrap { padding-block: 10px 8px; display: grid; gap: 8px; }
.title-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.title-row h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.title-row .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.icon-btn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }
.ctrl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.stepper button { border: 0; background: transparent; width: 34px; height: 32px; font-size: 18px; color: var(--muted); }
.stepper button:disabled { opacity: .3; cursor: default; }
.stepper span { padding: 0 4px; font-weight: 500; font-size: 14px; min-width: 130px; text-align: center; }
.sel { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; max-width: 100%; min-width: 0; }

/* view */
main { padding-block: 12px 96px; }
.stack { display: grid; gap: 12px; }
.card { background: var(--surface); border-radius: var(--r); padding: 14px; min-width: 0; }
.card h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.card h2 .r { float: right; text-transform: none; letter-spacing: 0; font-weight: 500; }

/* tabs */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tabs .wrap { display: flex; }
#tabs button { flex: 1; border: 0; background: transparent; padding: 8px 4px 9px; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--hint); }
#tabs button svg { width: 22px; height: 22px; }
#tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* buttons */
.btn { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 600; background: var(--accent); color: var(--accent-fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.sec { background: var(--surface-2); color: var(--fg); }
.btn.danger { background: var(--crit); color: #fff; }
.btn.danger-ghost { background: transparent; color: var(--crit); border: 1px solid var(--line); }
#tabs button { position: relative; }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 600; line-height: 17px; font-family: var(--mono); }
.notice { border-left: 3px solid var(--crit); background: var(--crit-bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.picks { display: grid; gap: 6px; }
.picks label { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 14px; cursor: pointer; }
.picks label:has(input:checked) { border-color: var(--accent); background: var(--accent-weak); }
.field .picks label { color: var(--fg); font-size: 14px; }
.field .picks input, .picks input { accent-color: var(--accent); margin: 0; width: 18px; height: 18px; padding: 0; flex: none; background: none; border: 0; }
.field textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 64px; resize: vertical; font: inherit; color: inherit; }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; }
.ev { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); }
.ev.in { background: var(--good-bg); } .ev.out { background: var(--crit-bg); } .ev.mv { background: var(--accent-weak); }
.btn.ghost { background: transparent; color: var(--accent); padding-inline: 6px; }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 8px; }
.btn:disabled { opacity: .5; }
.btn svg { width: 18px; height: 18px; }

/* KPI */
.hero { display: grid; gap: 2px; }
.hero .lbl { color: var(--muted); font-size: 13px; }
.hero .big { font-family: var(--mono); font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.delta { font-size: 13px; color: var(--muted); }
.delta b { font-weight: 600; color: var(--fg); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { background: var(--surface); padding: 12px 14px; min-width: 0; }
.tile .lbl { font-size: 12px; color: var(--muted); }
.tile .val { font-family: var(--mono); font-size: 19px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .note { font-size: 12px; color: var(--hint); margin-top: 1px; }

/* today strip */
.strip { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.strip span { display: inline-flex; align-items: center; gap: 6px; }
.strip b { color: var(--fg); font-family: var(--mono); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--surface-2); color: var(--fg); white-space: nowrap; }
.chip svg { width: 13px; height: 13px; }
.chip.good { background: var(--good-bg); } .chip.good svg { color: var(--good); }
.chip.warn { background: var(--warn-bg); } .chip.warn svg { color: var(--warn); }
.chip.crit { background: var(--crit-bg); } .chip.crit svg { color: var(--crit); }
.code { font-family: var(--mono); font-weight: 600; font-size: 11px; }

/* list rows */
.list { display: grid; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row.tap { cursor: pointer; }
.row .main { flex: 1; min-width: 0; }
.row .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.row .side { text-align: right; flex: none; }
.row .side .v { font-family: var(--mono); font-weight: 600; }
.row .side .s { font-size: 12px; color: var(--hint); }
.grp { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 14px 0 4px; }
.act { min-width: 92px; }

/* object cards */
.obj { display: grid; gap: 8px; cursor: pointer; }
.obj-head { display: flex; align-items: baseline; gap: 8px; }
.obj-head .n { font-weight: 600; flex: 1; min-width: 0; }
.obj-head .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; transform: translateY(1px); }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
.kv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kv div { min-width: 0; }
.kv .l { font-size: 11px; color: var(--hint); }
.kv .v { font-family: var(--mono); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* rank */
.rank .row { padding: 8px 0; }
.bar { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 5px; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--muted); }

/* chart */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--hint); font: 11px var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; border-radius: 8px; padding: 7px 9px; min-width: 130px; z-index: 2; box-shadow: 0 4px 16px rgb(0 0 0 / .18); }
.tip .t { font-weight: 600; margin-bottom: 3px; }
.tip .l { display: flex; justify-content: space-between; gap: 12px; }
.tip .l span:last-child { font-family: var(--mono); }
.tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }

/* timesheet matrix */
.mx-wrap { overflow-x: auto; }
table.mx { border-collapse: separate; border-spacing: 0; font-size: 12px; }
.mx th, .mx td { padding: 0; height: 30px; text-align: center; border-bottom: 1px solid var(--line); }
.mx thead th { font-weight: 500; color: var(--muted); font-family: var(--mono); height: 34px; line-height: 1.1; }
.mx thead th small { display: block; font-size: 9px; color: var(--hint); font-family: var(--font); }
.mx .nm { position: sticky; left: 0; background: var(--surface); text-align: left; padding: 0 10px 0 0; min-width: 132px; max-width: 132px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1; cursor: pointer; font-family: var(--font); font-size: 13px; }
.mx .d { min-width: 30px; font-family: var(--mono); position: relative; }
.mx .we { background: var(--surface-2); }
.mx .td { box-shadow: inset 0 0 0 1.5px var(--accent); }
.mx .ot { background: var(--ot-bg); font-weight: 600; }
.mx .late::after { content: ''; position: absolute; top: 4px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
.mx .cd { color: var(--muted); font-weight: 600; font-size: 10px; }
.mx .cd.pr { color: var(--crit); }
.mx .tot { font-family: var(--mono); font-weight: 600; padding: 0 6px; min-width: 50px; }
.mx-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.mx-legend b { font-family: var(--mono); color: var(--fg); }

/* sheets & pages */
#scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 20; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 16px 16px 0 0; max-height: 88%; overflow: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
#sheet .wrap { padding-block: 8px 18px; display: grid; gap: 14px; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 6px auto 0; }
#sheet h3 { margin: 0; font-size: 18px; }
#page { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow: auto; }
#page .top { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 2; padding-top: env(safe-area-inset-top, 0px); }
#page .top .wrap { display: flex; align-items: center; gap: 6px; padding-block: 8px; }
#page main { padding-bottom: 40px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.seg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 2px; display: grid; gap: 1px; font-size: 11px; color: var(--muted); }
.seg button b { font-family: var(--mono); font-size: 14px; color: var(--fg); }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); color: var(--fg); }
.receipt { display: grid; gap: 6px; font-size: 14px; }
.receipt div { display: flex; justify-content: space-between; gap: 10px; }
.receipt span:last-child { font-family: var(--mono); }
.receipt .sum { border-top: 1px dashed var(--line); padding-top: 8px; font-weight: 700; font-size: 16px; }
.err { color: var(--crit); font-size: 13px; }
#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.center-screen { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 12px; padding-block: 24px; }
.center-screen .id { font-family: var(--mono); font-size: 28px; font-weight: 600; background: var(--surface); padding: 10px 16px; border-radius: 10px; user-select: all; }
.search { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; }
.xtable { overflow-x: auto; }
.xtable table { border-collapse: collapse; font-size: 12px; }
.xtable td, .xtable th { border: 1px solid var(--line); padding: 4px 6px; white-space: nowrap; }
.xtable th { background: var(--surface-2); font-weight: 600; }
.tabs2 { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs2 button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.tabs2 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  #sheet { animation: up .18s ease-out; }
  #page { animation: fade .15s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
  @keyframes fade { from { opacity: 0; } }
}
</style>

</head>
<body>
<div id="demo" hidden></div>
<header id="top"><div class="wrap"></div></header>
<main id="view" class="wrap"><div class="center-screen"><div class="muted">Загрузка…</div></div></main>
<nav id="tabs" hidden><div class="wrap"></div></nav>
<div id="page" hidden></div>
<div id="scrim" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
/* ================================================================
   ЯДРО: расчёты табеля, отчёты, права доступа.
   Один и тот же код работает на сервере (Apps Script) и в демо.
   ================================================================ */
var Core = (function () {
  var C = (typeof CONFIG !== 'undefined' && CONFIG) || {};
  function opt(k, d) { return C[k] === undefined ? d : C[k]; }
  var CFG = {
    lateGraceMin: opt('lateGraceMin', 5),          // опоздание считается, если больше N минут
    defaultLunch: opt('defaultLunch', 60),         // обед по умолчанию, минут
    foremanEditDays: opt('foremanEditDays', 3),    // бригадир может править последние N дней
    foremanSeesPay: opt('foremanSeesPay', true),   // бригадир видит суммы зарплаты
    foremanGivesAdvance: opt('foremanGivesAdvance', false), // бригадир может вносить авансы
    foremanCanExport: opt('foremanCanExport', true),
    foremanSetsRate: opt('foremanSetsRate', true)  // бригадир указывает ставку при приёме
  };
  var HIRE_REASONS = ['Новый сотрудник', 'Замена выбывшего', 'Перевод с другого объекта', 'Усиление бригады', 'Сезонные работы', 'Другое'];
  var FIRE_REASONS = ['Уволился по собственному желанию', 'Уволен за нарушение дисциплины', 'Не прошёл испытательный срок',
    'Окончание работ на объекте', 'Перевод на другой объект', 'Другое'];
  var BOSS = 'Руководитель', FOREMAN = 'Бригадир';
  var STATUSES = [
    { id: 'Явка', code: 'Я' }, { id: 'Выходной', code: 'В' }, { id: 'Отпуск', code: 'ОТ' },
    { id: 'Больничный', code: 'Б' }, { id: 'Прогул', code: 'ПР' }
  ];
  var CODE = {}; STATUSES.forEach(function (s) { CODE[s.id] = s.code; });

  /* ---------- helpers ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function mins(t) { if (!t) return null; var p = String(t).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function r2(x) { return Math.round((+x || 0) * 100) / 100; }
  function monthOf(d) { return String(d).slice(0, 7); }
  function dim(m) { return new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7), 0)).getUTCDate(); }
  function addDays(d, n) { var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
  function addMonths(m, n) { var t = new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1)); return t.toISOString().slice(0, 7); }
  function dow(d) { return new Date(d + 'T00:00:00Z').getUTCDay(); }
  function isTime(t) { return /^([01]?\d|2[0-3]):[0-5]\d$/.test(String(t || '')); }
  function normTime(t) { if (!t) return ''; var m = mins(t); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function need(c, msg) { if (!c) throw new Error(msg); }
  function eq(a, b) { return String(a) === String(b); }
  function find(list, f) { for (var i = 0; i < list.length; i++) if (f(list[i])) return list[i]; return null; }
  function mapBy(list, k) { var o = {}; list.forEach(function (x) { o[x[k || 'id']] = x; }); return o; }

  function isBoss(ctx) { return ctx.role === BOSS; }
  function canSee(ctx, objId) { return isBoss(ctx) || eq(objId, ctx.objectId); }
  function paySeen(ctx) { return isBoss(ctx) || CFG.foremanSeesPay; }

  /* ---------- расчёт одной записи табеля ---------- */
  function calcRecord(rec, obj) {
    var h = 0;
    if (rec.status === 'Явка' && rec.in && rec.out) {
      var d = mins(rec.out) - mins(rec.in); if (d < 0) d += 1440;        // смена через полночь
      h = Math.max(0, (d - (+rec.lunch || 0)) / 60);
    }
    h = r2(h);
    var norm = +rec.norm || 8, nh = Math.min(h, norm), ot = r2(h - nh);
    var rate = +rec.rate || 0, k = +rec.otk || 1;
    rec.hours = h; rec.ot = ot; rec.sum = r2(nh * rate + ot * rate * k);
    var late = 0;
    if (rec.status === 'Явка' && rec.in && obj && obj.shiftStart) {
      var l = mins(rec.in) - mins(obj.shiftStart);
      if (l > CFG.lateGraceMin) late = l;
    }
    rec.late = late;
    return rec;
  }

  /* ---------- отчёт за месяц по сотрудникам ---------- */
  function monthRows(D, month, filter, withInactive) {
    var emps = mapBy(D.employees), map = {}, order = [];
    function row(empId, objId) {
      if (!map[empId]) {
        var e = emps[empId] || { id: empId, name: '(удалён)', position: '', objectId: objId, rate: 0 };
        map[empId] = { empId: e.id, name: e.name, position: e.position, objectId: e.objectId, rate: +e.rate || 0, active: !!e.active,
          days: 0, hours: 0, ot: 0, sum: 0, sum1_15: 0, late: 0, lateMin: 0, absent: 0, sick: 0, vacation: 0, off: 0,
          advance: 0, bonus: 0, deduction: 0, toPay: 0, cells: {} };
        order.push(empId);
      }
      return map[empId];
    }
    D.employees.forEach(function (e) { if ((e.active || withInactive) && filter(e.objectId)) row(e.id, e.objectId); });
    D.records.forEach(function (r) {
      if (monthOf(r.date) !== month || !filter(r.objectId)) return;
      var x = row(r.empId, r.objectId), day = +r.date.slice(8, 10);
      x.cells[day] = { s: r.status, h: r.hours, ot: r.ot, late: r.late, open: r.status === 'Явка' && !!r.in && !r.out };
      if (r.status === 'Явка') {
        x.days++; x.hours += r.hours; x.ot += r.ot; x.sum += r.sum; if (day <= 15) x.sum1_15 += r.sum;
        if (r.late) { x.late++; x.lateMin += r.late; }
      } else if (r.status === 'Прогул') x.absent++;
      else if (r.status === 'Больничный') x.sick++;
      else if (r.status === 'Отпуск') x.vacation++;
      else x.off++;
    });
    D.advances.forEach(function (a) { if (monthOf(a.date) === month && filter(a.objectId)) row(a.empId, a.objectId).advance += +a.amount || 0; });
    D.adjustments.forEach(function (a) {
      if (a.month !== month || !filter(a.objectId)) return;
      var x = row(a.empId, a.objectId); x.bonus += +a.bonus || 0; x.deduction += +a.deduction || 0;
    });
    var objs = mapBy(D.objects);
    return order.map(function (id) {
      var x = map[id];
      ['hours', 'ot', 'sum', 'sum1_15', 'advance', 'bonus', 'deduction'].forEach(function (k) { x[k] = r2(x[k]); });
      x.toPay = r2(x.sum + x.bonus - x.deduction - x.advance);
      x.objectName = (objs[x.objectId] || {}).name || x.objectId;
      var ee = emps[x.empId]; if (ee && !ee.active) { x.dismissedAt = ee.dismissedAt || ''; x.dismissReason = ee.dismissReason || ''; }
      return x;
    }).sort(function (a, b) { return String(a.objectName).localeCompare(b.objectName) || String(a.name).localeCompare(b.name); });
  }
  function stripPay(r) {
    ['rate', 'sum', 'sum1_15', 'advance', 'bonus', 'deduction', 'toPay'].forEach(function (k) { delete r[k]; });
    return r;
  }
  function totalsOf(rows) {
    var t = { count: rows.length, days: 0, hours: 0, ot: 0, sum: 0, advance: 0, bonus: 0, deduction: 0, toPay: 0, late: 0, absent: 0 };
    rows.forEach(function (r) { Object.keys(t).forEach(function (k) { if (k !== 'count') t[k] += +r[k] || 0; }); });
    Object.keys(t).forEach(function (k) { t[k] = r2(t[k]); });
    return t;
  }

  /* ---------- сводка для руководителя ---------- */
  function dashboard(D, month, today) {
    var all = function () { return true; };
    var rows = monthRows(D, month, all);
    var isCur = monthOf(today) === month;
    var n = dim(month), lastDay = isCur ? +today.slice(8, 10) : n;
    var objects = D.objects.filter(function (o) { return o.active; });
    var perObj = {};
    objects.forEach(function (o) {
      perObj[o.id] = { id: o.id, name: o.name, shiftStart: o.shiftStart, headcount: 0, presentToday: 0, onSite: 0, lateToday: 0,
        hours: 0, ot: 0, sum: 0, advance: 0, late: 0, absent: 0, days: 0 };
    });
    D.employees.forEach(function (e) { if (e.active && perObj[e.objectId]) perObj[e.objectId].headcount++; });
    var daily = [];
    for (var d = 1; d <= n; d++) daily.push({ day: d, date: month + '-' + pad(d), total: 0, hours: 0, present: 0, byObj: {} });
    var status = {}; STATUSES.forEach(function (s) { status[s.id] = 0; });
    var prevMonth = addMonths(month, -1), prevSum = 0;
    D.records.forEach(function (r) {
      var o = perObj[r.objectId];
      if (r.date === today && o && r.status === 'Явка') {
        o.presentToday++; if (r.in && !r.out) o.onSite++; if (r.late) o.lateToday++;
      }
      if (monthOf(r.date) === prevMonth && +r.date.slice(8, 10) <= lastDay && r.status === 'Явка') prevSum += r.sum;
      if (monthOf(r.date) !== month) return;
      status[r.status] = (status[r.status] || 0) + 1;
      if (!o) return;
      if (r.status === 'Явка') {
        var dd = daily[+r.date.slice(8, 10) - 1];
        dd.total += r.sum; dd.hours += r.hours; dd.present++; dd.byObj[r.objectId] = (dd.byObj[r.objectId] || 0) + r.sum;
        o.hours += r.hours; o.ot += r.ot; o.sum += r.sum; o.days++; if (r.late) o.late++;
      } else if (r.status === 'Прогул') o.absent++;
    });
    D.advances.forEach(function (a) { if (monthOf(a.date) === month && perObj[a.objectId]) perObj[a.objectId].advance += +a.amount || 0; });
    daily.forEach(function (x) { x.total = r2(x.total); x.hours = r2(x.hours); Object.keys(x.byObj).forEach(function (k) { x.byObj[k] = r2(x.byObj[k]); }); });
    var objList = objects.map(function (o) {
      var x = perObj[o.id];
      ['hours', 'ot', 'sum', 'advance'].forEach(function (k) { x[k] = r2(x[k]); });
      x.toPay = r2(rows.filter(function (r) { return eq(r.objectId, o.id); }).reduce(function (s, r) { return s + r.toPay; }, 0));
      var fm = find(D.users, function (u) { return u.role === FOREMAN && eq(u.objectId, o.id); });
      x.foreman = fm ? fm.name : '';
      return x;
    });
    var t = totalsOf(rows);
    var headcount = objList.reduce(function (s, o) { return s + o.headcount; }, 0);
    var present = objList.reduce(function (s, o) { return s + o.presentToday; }, 0);
    var lateToday = objList.reduce(function (s, o) { return s + o.lateToday; }, 0);
    var onSite = objList.reduce(function (s, o) { return s + o.onSite; }, 0);
    function top(key, cond) {
      return rows.filter(function (r) { return cond(r); }).sort(function (a, b) { return b[key] - a[key]; }).slice(0, 5)
        .map(function (r) { return { empId: r.empId, name: r.name, objectName: r.objectName, value: r[key], extra: key === 'late' ? r.lateMin : r.sum }; });
    }
    return {
      month: month, today: today, isCurrent: isCur, lastDay: lastDay, days: n,
      totals: {
        sum: t.sum, hours: t.hours, ot: t.ot, advance: t.advance, bonus: t.bonus, deduction: t.deduction, toPay: t.toPay,
        headcount: headcount, presentToday: present, onSite: onSite, lateToday: lateToday,
        late: t.late, absent: t.absent, manDays: t.days,
        attendance: (t.days + t.absent) ? r2(t.days / (t.days + t.absent)) : 0,
        avgHours: t.days ? r2(t.hours / t.days) : 0,
        otShare: t.hours ? r2(t.ot / t.hours) : 0,
        avgRate: t.hours ? r2(t.sum / t.hours) : 0,
        prevSum: r2(prevSum)
      },
      objects: objList, daily: daily, status: status, hr: hrSummary(D, month, function () { return true; }),
      topOT: top('ot', function (r) { return r.ot > 0; }),
      topLate: top('late', function (r) { return r.late > 0; }),
      topAbsent: top('absent', function (r) { return r.absent > 0; })
    };
  }

  function hrSummary(D, month, filter) {
    var ev = (D.hr || []).filter(function (h) { return monthOf(h.date) === month && filter(h.objectId); })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var objs = mapBy(D.objects), reasons = {};
    ev.forEach(function (h) { if (h.action === 'Удалён') reasons[h.reason] = (reasons[h.reason] || 0) + 1; });
    return {
      hired: ev.filter(function (h) { return h.action === 'Принят' || h.action === 'Восстановлен'; }).length,
      dismissed: ev.filter(function (h) { return h.action === 'Удалён'; }).length,
      transferred: ev.filter(function (h) { return h.action === 'Переведён'; }).length,
      reasons: reasons,
      events: ev.slice(0, 10).map(function (h) { var x = JSON.parse(JSON.stringify(h)); x.objectName = (objs[h.objectId] || {}).name || h.objectId; return x; })
    };
  }

  /* ---------- заявки на доступ (вызывается для неизвестных пользователей) ---------- */
  function registerRequest(store, u) {
    var D = store.data, id = String(u.id);
    if (find(D.requests, function (r) { return r.tgId === id; })) return;
    store.insert('requests', { tgId: id, name: [u.first_name, u.last_name].filter(Boolean).join(' '), username: u.username || '', date: store.now().date + ' ' + store.now().time });
  }

  /* ---------- выгрузка ---------- */
  function buildExport(D, month, filter, withPay) {
    var rows = monthRows(D, month, filter), n = dim(month), objs = mapBy(D.objects);
    var sheets = [];
    var h1 = ['Объект', 'Сотрудник', 'Должность'];
    if (withPay) h1.push('Ставка, ₽/ч');
    h1 = h1.concat(['Дней', 'Часов', 'Сверхурочных, ч', 'Опозданий', 'Прогулов', 'Больничных', 'Отпуск']);
    if (withPay) h1 = h1.concat(['Начислено, ₽', 'Начислено 1–15, ₽', 'Аванс, ₽', 'Премия, ₽', 'Удержание, ₽', 'К выплате, ₽']);
    var r1 = rows.map(function (r) {
      var a = [r.objectName, r.name, r.position];
      if (withPay) a.push(r.rate);
      a = a.concat([r.days, r.hours, r.ot, r.late, r.absent, r.sick, r.vacation]);
      if (withPay) a = a.concat([r.sum, r.sum1_15, r.advance, r.bonus, r.deduction, r.toPay]);
      return a;
    });
    var t = totalsOf(rows);
    var tr = ['ИТОГО', rows.length + ' чел.', ''];
    if (withPay) tr.push('');
    tr = tr.concat([t.days, t.hours, t.ot, t.late, t.absent, '', '']);
    if (withPay) tr = tr.concat([t.sum, '', t.advance, t.bonus, t.deduction, t.toPay]);
    r1.push(tr);
    sheets.push({ name: 'Сотрудники', header: h1, rows: r1 });

    var h2 = ['Объект', 'Сотрудник']; for (var d = 1; d <= n; d++) h2.push(d); h2 = h2.concat(['Дней', 'Часов']);
    sheets.push({ name: 'Табель', header: h2, rows: rows.map(function (r) {
      var a = [r.objectName, r.name];
      for (var d = 1; d <= n; d++) { var c = r.cells[d]; a.push(!c ? '' : c.s === 'Явка' ? c.h : CODE[c.s] || c.s); }
      return a.concat([r.days, r.hours]);
    }) });

    var byObj = {};
    rows.forEach(function (r) {
      var o = byObj[r.objectId] || (byObj[r.objectId] = { name: r.objectName, n: 0, days: 0, hours: 0, ot: 0, sum: 0, advance: 0, toPay: 0 });
      o.n++; o.days += r.days; o.hours += r.hours; o.ot += r.ot; o.sum += r.sum; o.advance += r.advance; o.toPay += r.toPay;
    });
    var h3 = ['Объект', 'Сотрудников', 'Человеко-дней', 'Часов', 'Сверхурочных, ч'];
    if (withPay) h3 = h3.concat(['Начислено, ₽', 'Авансы, ₽', 'К выплате, ₽']);
    sheets.push({ name: 'Объекты', header: h3, rows: Object.keys(byObj).map(function (k) {
      var o = byObj[k], a = [o.name, o.n, o.days, r2(o.hours), r2(o.ot)];
      return withPay ? a.concat([r2(o.sum), r2(o.advance), r2(o.toPay)]) : a;
    }) });

    var emps = mapBy(D.employees);
    var h4 = ['Дата', 'Объект', 'Сотрудник', 'Статус', 'Приход', 'Уход', 'Обед, мин', 'Часы', 'Сверх, ч', 'Опоздание, мин', 'Внёс'];
    if (withPay) h4.splice(9, 0, 'Сумма, ₽');
    var recs = D.records.filter(function (r) { return monthOf(r.date) === month && filter(r.objectId); })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    sheets.push({ name: 'Записи', header: h4, rows: recs.map(function (r) {
      var a = [r.date.split('-').reverse().join('.'), (objs[r.objectId] || {}).name || r.objectId, (emps[r.empId] || {}).name || r.empName,
        r.status, r.in || '', r.out || '', r.lunch, r.hours, r.ot, r.late, r.by || ''];
      if (withPay) a.splice(9, 0, r.sum);
      return a;
    }) });
    return sheets;
  }

  /* ---------- API ---------- */
  function handle(action, p, ctx, store) {
    var D = store.data, now = store.now(); p = p || {};
    var objs = mapBy(D.objects);
    function emp(id) { var e = find(D.employees, function (x) { return eq(x.id, id); }); need(e, 'Сотрудник не найден'); need(canSee(ctx, e.objectId), 'Нет доступа к этому сотруднику'); return e; }
    function recOf(empId, date) { return find(D.records, function (r) { return eq(r.empId, empId) && r.date === date; }); }
    function editable(date) {
      if (isBoss(ctx)) return true;
      return date <= now.date && date >= addDays(now.date, -CFG.foremanEditDays);
    }
    function visibleFilter(objId) { return function (o) { return canSee(ctx, o) && (!objId || eq(o, objId)); }; }
    function save(rec, isNew) {
      calcRecord(rec, objs[rec.objectId]); rec.by = ctx.name; rec.updated = now.date + ' ' + now.time;
      if (isNew) store.insert('records', rec); else store.update('records', rec);
    }
    function hrLog(e, action, reason, comment, date) {
      if (!D.hr) return;
      store.insert('hr', { id: store.uid(), date: date || now.date, empId: e.id, empName: e.name, objectId: e.objectId, action: action,
        reason: String(reason || '').slice(0, 120), comment: String(comment || '').slice(0, 300), by: ctx.name });
    }
    function assignUser(p) {
      var id = String(p.tgId || '').trim();
      need(/^\d{3,15}$/.test(id), 'Telegram ID — это число из приложения, например 123456789');
      need(p.role === BOSS || p.role === FOREMAN, 'Выберите роль');
      if (p.role === FOREMAN) need(objs[p.objectId], 'Выберите объект для бригадира');
      var u = find(D.users, function (z) { return eq(z.tgId, id); });
      var rq = find(D.requests || [], function (z) { return eq(z.tgId, id); });
      if (u && eq(id, ctx.tgId)) need(p.role === BOSS, 'Нельзя снять роль руководителя с самого себя');
      var name = String(p.name || (u && u.name) || (rq && rq.name) || '').trim();
      need(name, 'Укажите имя');
      var isNew = !u;
      u = u || { tgId: id };
      u.name = name; u.role = p.role; u.objectId = p.role === FOREMAN ? p.objectId : '';
      if (isNew) store.insert('users', u); else store.update('users', u);
      if (rq) store.remove('requests', rq);
    }
    function accessView(focusId) {
      return {
        focus: focusId || '',
        objects: D.objects.map(function (o) {
          return { id: o.id, name: o.name, address: o.address, shiftStart: o.shiftStart, active: o.active,
            headcount: D.employees.filter(function (e) { return e.active && eq(e.objectId, o.id); }).length,
            foremen: D.users.filter(function (u) { return u.role === FOREMAN && eq(u.objectId, o.id); }).map(function (u) { return { tgId: u.tgId, name: u.name }; }) };
        }),
        users: D.users.map(function (u) { return { tgId: u.tgId, name: u.name, role: u.role, objectId: u.objectId, objectName: (objs[u.objectId] || {}).name || '', self: eq(u.tgId, ctx.tgId) }; }),
        requests: (D.requests || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; })
      };
    }
    function newRec(e, date) {
      return { id: store.uid(), date: date, empId: e.id, empName: e.name, objectId: e.objectId, status: 'Явка', in: '', out: '',
        lunch: CFG.defaultLunch, rate: +e.rate || 0, norm: +e.norm || 8, otk: +e.otk || 1, hours: 0, ot: 0, sum: 0, late: 0, by: '', updated: '' };
    }
    function dayView(date, objId) {
      var rows = D.employees.filter(function (e) { return canSee(ctx, e.objectId) && (!objId || eq(e.objectId, objId)); })
        .map(function (e) {
          var r = recOf(e.id, date);
          if (!e.active && !r) return null;
          var rr = r ? JSON.parse(JSON.stringify(r)) : null;
          if (rr && !paySeen(ctx)) { delete rr.sum; delete rr.rate; }
          return { emp: { id: e.id, name: e.name, position: e.position, objectId: e.objectId, objectName: (objs[e.objectId] || {}).name }, rec: rr };
        }).filter(Boolean)
        .sort(function (a, b) { return String(a.emp.objectName).localeCompare(b.emp.objectName) || a.emp.name.localeCompare(b.emp.name); });
      var s = { total: rows.length, present: 0, onSite: 0, left: 0, late: 0, unmarked: 0, absent: 0, other: 0 };
      rows.forEach(function (x) {
        var r = x.rec;
        if (!r) s.unmarked++;
        else if (r.status === 'Явка') { s.present++; if (r.in && !r.out) s.onSite++; if (r.out) s.left++; if (r.late) s.late++; }
        else if (r.status === 'Прогул') s.absent++; else s.other++;
      });
      return { date: date, objectId: objId || '', isToday: date === now.date, editable: editable(date), rows: rows, summary: s, now: now.time };
    }

    switch (action) {
      case 'init':
        return {
          me: { name: ctx.name, role: ctx.role, objectId: ctx.objectId, isBoss: isBoss(ctx) },
          today: now.date, time: now.time, statuses: STATUSES,
          objects: D.objects.filter(function (o) { return o.active && canSee(ctx, o.id); })
            .map(function (o) { return { id: o.id, name: o.name, address: o.address, shiftStart: o.shiftStart }; }),
          config: { foremanSeesPay: CFG.foremanSeesPay, foremanGivesAdvance: CFG.foremanGivesAdvance, foremanEditDays: CFG.foremanEditDays,
            foremanCanExport: CFG.foremanCanExport, paySeen: paySeen(ctx), canExport: isBoss(ctx) || CFG.foremanCanExport,
            canAdvance: isBoss(ctx) || CFG.foremanGivesAdvance, lateGraceMin: CFG.lateGraceMin,
            canSetRate: isBoss(ctx) || CFG.foremanSetsRate },
          hireReasons: HIRE_REASONS, fireReasons: FIRE_REASONS,
          pendingRequests: isBoss(ctx) ? (D.requests || []).length : 0
        };

      case 'day':
        return dayView(p.date || now.date, p.objectId);

      case 'mark': {
        var date = p.date || now.date;
        need(editable(date), 'Этот день уже закрыт для изменений');
        var ids = [].concat(p.empIds || []);
        need(ids.length, 'Не выбраны сотрудники');
        ids.forEach(function (id) {
          var e = emp(id), r = recOf(e.id, date), isNew = !r;
          if (p.action === 'in') {
            var t = p.time || (date === now.date ? now.time : ((objs[e.objectId] || {}).shiftStart || '08:00'));
            if (r && r.status === 'Явка' && r.in) return;
            r = r || newRec(e, date); r.status = 'Явка'; r.in = normTime(t); r.out = '';
          } else if (p.action === 'out') {
            need(r && r.in, e.name + ': сначала отметьте приход');
            if (r.out) return;
            r.out = normTime(p.time || now.time);
          } else if (p.action === 'status') {
            need(CODE[p.status], 'Неизвестный статус');
            r = r || newRec(e, date); r.status = p.status;
            if (p.status !== 'Явка') { r.in = ''; r.out = ''; }
          } else throw new Error('Неизвестное действие');
          save(r, isNew);
        });
        return dayView(date, p.objectId);
      }

      case 'edit': {
        var d2 = p.date || now.date;
        need(editable(d2), 'Этот день уже закрыт для изменений');
        var e2 = emp(p.empId), r2_ = recOf(e2.id, d2), isNew2 = !r2_;
        need(CODE[p.status], 'Неизвестный статус');
        r2_ = r2_ || newRec(e2, d2);
        r2_.status = p.status;

function api(action, params) {
  if (DEMO) return Demo.call(action, params || {});
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ initData: tg.initData, action: action, params: params || {} }) })
    .then(function (r) { return r.text(); }, function () { var e = new Error('Нет связи с сервером'); e.net = true; throw e; })
    .then(function (t) { try { return JSON.parse(t); } catch (x) { var e = new Error('Сервер ответил не так, как ожидалось'); e.net = true; throw e; } })
    .then(function (j) {
      if (!j.ok) throw new Error(j.error || 'Ошибка сервера');
      if (j.unknown) { renderUnknown(j); var e = new Error('unknown'); e.silent = true; throw e; }
      return j.data;
    });
}

  function data() { if (!D) D = Core.demoData(now().date); return D; }
  var n = 0;
  function store() { return { data: data(), now: now, uid: function () { return 'd' + Date.now().toString(36) + (n++); },
    insert: function (t, o) { D[t].push(o); }, update: function () {},
    remove: function (t, o) { var i = D[t].indexOf(o); if (i >= 0) D[t].splice(i, 1); },

  return {
    call: function (a, p) { return new Promise(function (res, rej) { setTimeout(function () {
      try { res(JSON.parse(JSON.stringify(Core.handle(a, p, ctx(), store())))); } catch (e) { rej(e); } }, 90); }); },
    users: function () { return data().users; }, objects: function () { return data().objects; },

/* ---------- графики ---------- */
function niceStep(max, n) {
  var raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}
function barPath(x, y, w, h, r) {
  if (h <= 0) return ''; r = Math.min(r, w / 2, h);
  return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
}
function columnChart(box, cfg) {
  // cfg: n, stacks(i) -> [{v,color,label}], label(i), tip(i) -> html, refLine, fmtAxis, ticks
  function draw() {
    var W = Math.max(280, box.clientWidth), H = cfg.height || 190, L = 44, R = 6, T = 8, B = 22;
    var pw = W - L - R, ph = H - T - B, band = pw / cfg.n, bw = Math.max(3, Math.min(18, band * 0.64));
    var max = 0; for (var i = 0; i < cfg.n; i++) { var s = cfg.stacks(i).reduce(function (a, x) { return a + x.v; }, 0); if (s > max) max = s; }
    if (cfg.refLine) max = Math.max(max, cfg.refLine * 1.15);
    var step = niceStep(max || 1, 4), top = Math.ceil((max || 1) / step) * step, y = function (v) { return T + ph - v / top * ph; };
    var g = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(cfg.aria) + '">';
    for (var v = 0; v <= top + 1e-9; v += step) {
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1"' + (v ? ' stroke-dasharray="2 3"' : '') + '/>';
      g += '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + cfg.fmtAxis(v) + '</text>';
    }
    if (cfg.refLine) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(cfg.refLine) + '" y2="' + y(cfg.refLine) + '" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5 4"/>';
    g += '<rect class="hl" x="0" y="' + T + '" width="' + band + '" height="' + ph + '" fill="var(--fg)" opacity="0" rx="4"/>';
    for (var i2 = 0; i2 < cfg.n; i2++) {
      var x = L + i2 * band + (band - bw) / 2, acc = 0, st = cfg.stacks(i2).filter(function (s) { return s.v > 0; });
      st.forEach(function (s, k) {
        var y0 = y(acc + s.v), hh = y(acc) - y0, last = k === st.length - 1;
        g += last ? '<path d="' + barPath(x, y0, bw, hh, Math.min(4, bw / 2)) + '" fill="' + s.color + '"/>' : '<rect x="' + x + '" y="' + y0 + '" width="' + bw + '" height="' + hh + '" fill="' + s.color + '"/>';
        if (k > 0) g += '<rect x="' + x + '" y="' + (y(acc) - 1) + '" width="' + bw + '" height="2" fill="var(--surface)"/>';
        acc += s.v;
      });
      if (cfg.mark && cfg.mark(i2)) g += '<text x="' + (L + i2 * band + band / 2) + '" y="' + (T + ph - 4) + '" text-anchor="middle" style="font-size:9px">' + cfg.mark(i2) + '</text>';
      var lb = cfg.label(i2); if (lb) g += '<text x="' + (L + i2 * band + band / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + lb + '</text>';
    }
    g += '</svg><div class="tip" hidden></div>';
    box.innerHTML = g;
    var svg = box.querySelector('svg'), tip = box.querySelector('.tip'), hl = box.querySelector('.hl');
    function show(ev) {
      var r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width, i = Math.floor((sx - L) / band);
      if (i < 0 || i >= cfg.n) { hide(); return; }
      var html = cfg.tip(i); if (!html) { hide(); return; }
      hl.setAttribute('x', L + i * band); hl.setAttribute('opacity', '0.06');
      tip.innerHTML = html; tip.hidden = false;
      var bx = (L + i * band + band / 2) * r.width / W, tw = tip.offsetWidth, left = bx + 12;

  }

}

/* ---------- карточка отметки ---------- */
function openRecord(emp, rec, date, editable, after) {
  var st = rec ? rec.status : 'Явка';
  var h = '<div><h3>' + esc(emp.name) + '</h3><div class="muted">' + fmtDay(date) + '</div></div>';

    h += '<div class="receipt"><div><span>Отработано</span><span>' + hrs(rec.hours) + '</span></div>' + (rec.ot ? '<div><span>Из них сверхурочно</span><span>' + hrs(rec.ot) + '</span></div>' : '') +
      (rec.sum !== undefined ? '<div><span>Начислено за день</span><span>' + money(rec.sum) + '</span></div>' : '') + (rec.late ? '<div><span>Опоздание</span><span>' + rec.late + ' мин</span></div>' : '') + '</div>';
  }
  if (editable) {
    h += '<div class="seg" role="group" aria-label="Статус дня">' + Core.STATUSES.map(function (s) {
      return '<button type="button" data-st="' + s.id + '" aria-pressed="' + (s.id === st) + '"><b>' + s.code + '</b>' + s.id + '</button>'; }).join('') + '</div>';
    h += '<div id="timeBox" class="three"' + (st !== 'Явка' ? ' hidden' : '') + '>' +
      '<div class="field"><label for="fIn">Приход</label><input id="fIn" type="time" value="' + (rec && rec.in || (date === S.init.today ? '' : '08:00')) + '"></div>' +
      '<div class="field"><label for="fOut">Уход</label><input id="fOut" type="time" value="' + (rec && rec.out || '') + '"></div>' +
      '<div class="field"><label for="fLunch">Обед, мин</label><input id="fLunch" type="number" inputmode="numeric" min="0" max="600" value="' + (rec ? rec.lunch : 60) + '"></div></div>';
    h += '<div class="err" id="fErr" hidden></div><button class="btn block" id="fSave">Сохранить</button>';
  } else h += '<div class="hint">Этот день закрыт для изменений.</div>';
  h += '<button class="btn ghost" id="fCard">Карточка сотрудника за месяц →</button>';
  openSheet(h, function (sh) {
    sh.querySelectorAll('[data-st]').forEach(function (b) { b.onclick = function () {
      st = b.dataset.st; sh.querySelectorAll('[data-st]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
      $('#timeBox').hidden = st !== 'Явка'; }; });

      sv.disabled = true;
      api('edit', p).then(function () { closeSheet(); haptic('success'); toast('Сохранено'); after && after(); })
        .catch(function (e) { sv.disabled = false; var er = $('#fErr'); er.textContent = e.message; er.hidden = false; });
    };

}
function openGrant(u, isNew) {
  u = u || { tgId: '', name: '' };
  var role = u.role || 'Бригадир';
  var h = '<h3>' + (isNew ? 'Выдать доступ' : 'Доступ') + '</h3>' +
    (u.tgId && !isNew ? '' : '') +
    '<div class="two"><div class="field"><label for="gId">Telegram ID</label><input id="gId" type="text" inputmode="numeric" value="' + esc(u.tgId) + '"' + (u.tgId ? ' readonly' : ' placeholder="Например: 123456789"') + '></div>' +
    '<div class="field"><label for="gName">Имя</label><input id="gName" type="text" value="' + esc(u.name || '') + '"></div></div>' +
    '<div class="field"><label>Роль</label><div class="picks"><label><input type="radio" name="gRole" value="Бригадир"' + (role === 'Бригадир' ? ' checked' : '') + '> Бригадир — видит только свой объект</label>' +
    '<label><input type="radio" name="gRole" value="Руководитель"' + (role === 'Руководитель' ? ' checked' : '') + '> Руководитель — видит всё</label></div></div>' +
    '<div class="field" id="gObjBox"><label for="gObj">Объект</label><select id="gObj">' + objOptions(u.objectId, true) + '</select></div>' +
    '<div class="err" id="gErr" hidden></div><button class="btn block" id="gSave">' + (isNew ? 'Выдать доступ' : 'Сохранить') + '</button>' +
    (!isNew && !u.self ? '<button class="btn danger-ghost block" id="gDel">Закрыть доступ</button>' : '');
  openSheet(h, function (sh) {
    function sync() { $('#gObjBox').hidden = picked('gRole') !== 'Бригадир'; }
    sh.querySelectorAll('input[name="gRole"]').forEach(function (r) { r.onchange = sync; }); sync();
    $('#gSave').onclick = function () {
      var btn = this; btn.disabled = true;
      api('saveUser', { tgId: $('#gId').value.trim(), name: $('#gName').value, role: picked('gRole'), objectId: $('#gObj').value })
        .then(function (x) { closeSheet(); haptic('success'); toast('Доступ выдан'); drawTeam(x); })
        .catch(function (er) { btn.disabled = false; $('#gErr').textContent = er.message; $('#gErr').hidden = false; });
    };
    var del = $('#gDel');
    if (del) del.onclick = function () {
      if (del.dataset.sure !== '1') { del.dataset.sure = '1'; del.textContent = 'Нажмите ещё раз, чтобы закрыть доступ'; return; }
      del.disabled = true; api('removeUser', { tgId: u.tgId }).then(function (x) { closeSheet(); toast('Доступ закрыт'); drawTeam(x); }).catch(fail);
    };
  });
}

/* ================= ВЫГРУЗКА ================= */
function doExport() {
  openSheet('<h3>Выгрузка отчёта</h3><div class="muted">' + fmtMonth(S.month) + ' · ' + esc(S.obj ? objName(S.obj) : (S.init.me.isBoss ? 'все объекты' : objName(S.init.me.objectId))) +
    '</div><div class="muted" style="font-size:14px">Будет создана новая Google Таблица с листами: Сотрудники (зарплата), Табель (по дням), Объекты, Записи.</div><button class="btn block" id="xGo">' + ic('export') + 'Создать Google Таблицу</button>', function () {
    $('#xGo').onclick = function () {
      var btn = this; btn.disabled = true; btn.textContent = 'Формирую отчёт…';
      api('export', { month: S.month, objectId: S.obj }).then(function (r) {
        if (r.demo) return exportPreview(r);
        haptic('success');
        openSheet('<h3>Отчёт готов</h3><div class="muted" style="font-size:14px">' + esc(r.title) + '</div>' +
          '<button class="btn block" id="xOpen">Открыть Google Таблицу</button><button class="btn sec block" id="xXlsx">Скачать Excel (.xlsx)</button>' +
          '<div class="hint" style="font-size:13px">Таблица сохранена на Google Диске руководителя. Открыть её может только тот, у кого есть ссылка.</div>', function () {
          $('#xOpen').onclick = function () { openLink(r.url); };
          $('#xXlsx').onclick = function () { openLink(r.xlsxUrl); };
        });
      }).catch(function (e) { btn.disabled = false; btn.textContent = 'Создать Google Таблицу'; fail(e); });
    };
  });
}
function exportPreview(r) {
  var cur = 0;
  function draw() {
    var s = r.sheets[cur];
    var h = '<h3>Так будет выглядеть отчёт</h3><div class="muted" style="font-size:13px">В демо таблица не создаётся. В рабочей версии откроется Google Таблица с этими листами.</div>' +
      '<div class="tabs2">' + r.sheets.map(function (x, i) { return '<button data-i="' + i + '" aria-pressed="' + (i === cur) + '">' + esc(x.name) + '</button>'; }).join('') + '</div>' +
      '<div class="xtable"><table><thead><tr>' + s.header.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      s.rows.slice(0, 40).map(function (row) { return '<tr>' + row.map(function (c) { return '<td' + (typeof c === 'number' ? ' class="num" style="text-align:right"' : '') + '>' + esc(typeof c === 'number' ? nf1.format(c) : c) + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></div>' + (s.rows.length > 40 ? '<div class="hint" style="font-size:12px">Показаны первые 40 строк из ' + s.rows.length + '</div>' : '') + '<button class="btn sec block" id="xClose">Закрыть</button>';
    openSheet(h, function (sh) {
      sh.querySelectorAll('[data-i]').forEach(function (b) { b.onclick = function () { cur = +b.dataset.i; draw(); }; });
      $('#xClose').onclick = closeSheet;
    });
  }
  draw();
}

/* ================= служебные экраны ================= */
function renderUnknown(j) {
  $('#tabs').hidden = true; $('#top .wrap').innerHTML = '<div class="title-row"><h1>Табель бригад</h1></div>';
  $('#view').innerHTML = '<div class="center-screen"><div style="font-size:18px;font-weight:600">' + esc(j.tgName || 'Здравствуйте') + ', вас пока нет в списке</div>' +
    '<div class="muted">Заявка отправлена руководителю. Когда он выдаст доступ, закройте и снова откройте приложение.<br>Ваш Telegram ID:</div><div class="id" id="tgId">' + esc(j.tgId) + '</div>' +
    '<button class="btn sec" id="cp">Скопировать ID</button><div class="hint" style="font-size:13px">После этого закройте и снова откройте приложение.</div></div>';
  $('#cp').onclick = function () { navigator.clipboard && navigator.clipboard.writeText(j.tgId).then(function () { toast('Скопировано'); }, function () { toast('Выделите номер и скопируйте'); }); };
}
function renderOutside() {
  $('#top .wrap').innerHTML = '<div class="title-row"><h1>Табель бригад</h1></div>';
  $('#view').innerHTML = '<div class="center-screen"><div style="font-size:18px;font-weight:600">Откройте приложение через бота в Telegram</div><div class="muted">Вход по вашему Telegram-аккаунту, пароль не нужен.</div><button class="btn" id="goDemo">Посмотреть демо</button></div>';
  $('#goDemo').onclick = function () { startDemo(); };
}
function demoBar() {
  var bar = $('#demo'); bar.hidden = false;
  var objs = Demo.objects();
  bar.innerHTML = '<div class="wrap"><b>Демо</b><span>данные вымышленные · смотреть как</span><select id="demoRole" aria-label="Смотреть как">' + Demo.users().map(function (u) {
    var o = objs.filter(function (x) { return x.id === u.objectId; })[0];
    return '<option value="' + u.tgId + '"' + (u.tgId === Demo.role() ? ' selected' : '') + '>' + esc(u.role + ' — ' + (o ? o.name : 'все объекты')) + '</option>'; }).join('') + '</select></div>';
  $('#demoRole').onchange = function () { Demo.setRole(this.value); closePage(); boot(); };
}

/* ================= запуск ================= */
function boot() {
  S.obj = ''; S.staffQ = '';
  api('init').then(function (d) {
    S.init = d; S.date = d.today; S.month = Core.util.monthOf(d.today);
    S.tab = d.me.isBoss ? 'dash' : 'today';
    renderTabs(); render();
  }).catch(function (e) { if (!e.silent) { $('#top .wrap').innerHTML = '<div class="title-row"><h1>Табель бригад</h1></div>'; errorView(e); } });
}
function startDemo() { DEMO = true; demoBar(); boot(); }

function applyTheme() {
  if (!tg) return;
  var p = tg.themeParams || {}, r = document.documentElement;
  if (tg.colorScheme) r.setAttribute('data-theme', tg.colorScheme);
  var set = function (k, v) { if (v) r.style.setProperty(k, v); };
  set('--bg', p.secondary_bg_color); set('--surface', p.section_bg_color || p.bg_color); set('--fg', p.text_color);
  set('--muted', p.subtitle_text_color || p.hint_color); set('--hint', p.hint_color); set('--accent', p.button_color); set('--accent-fg', p.button_text_color);
  try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
}

if (IN_TG) {
  tg.ready(); tg.expand(); applyTheme(); tg.onEvent('themeChanged', applyTheme);
  if (!API_URL || API_URL.indexOf('__') === 0) { startDemo(); }
  else if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec\/?$/.test(API_URL.trim())) {
    $('#top .wrap').innerHTML = '<div class="title-row"><h1>Табель бригад</h1></div>';
    var er = new Error('Неверный адрес сервера в index.html'); er.net = true; errorView(er);
  } else { API_URL = API_URL.trim(); boot(); }
} else if (!API_URL || API_URL.indexOf('__') === 0) {
  startDemo();
} else {
  renderOutside();
}
})();
</script>

</body>
