function openMoney(kind, e, month) {
  var adv = kind === 'advance';
  var h = '<h3>' + (adv ? 'Выдать аванс' : 'Премия или удержание') + '</h3><div class="muted">' + esc(e.name) + ' · ' + fmtMonth(month).toLowerCase() + '</div>';
  if (adv) h += '<div class="two"><div class="field"><label for="mAmt">Сумма, ₽</label><input id="mAmt" type="number" inputmode="decimal" min="0" step="100"></div><div class="field"><label for="mDate">Дата</label><input id="mDate" type="date" value="' + S.init.today + '"></div></div>';
  else h += '<div class="two"><div class="field"><label for="mBonus">Премия, ₽</label><input id="mBonus" type="number" inputmode="decimal" min="0" step="100"></div><div class="field"><label for="mDed">Удержание, ₽</label><input id="mDed" type="number" inputmode="decimal" min="0" step="100"></div></div>';
  h += '<div class="field"><label for="mCom">Комментарий</label><input id="mCom" type="text" maxlength="200" placeholder="' + (adv ? 'Например: наличными на объекте' : 'За что') + '"></div><div class="err" id="mErr" hidden></div><button class="btn block" id="mSave">Сохранить</button>';
  openSheet(h, function () {
    $('#mSave').onclick = function () {
      var p = adv ? { empId: e.id, amount: $('#mAmt').value, date: $('#mDate').value, comment: $('#mCom').value } : { empId: e.id, month: month, bonus: $('#mBonus').value, deduction: $('#mDed').value, comment: $('#mCom').value };
      this.disabled = true; var btn = this;
      api(adv ? 'addAdvance' : 'addAdjustment', p).then(function (res) { if (res && res.cash) S.init.cash = res.cash; closeSheet(); haptic('success'); toast('Сохранено'); S.pageFn && S.pageFn(); })
        .catch(function (er) { btn.disabled = false; $('#mErr').textContent = er.message; $('#mErr').hidden = false; });
    };
  });
}

function reasonPicks(name, list, sel) {
  return '<div class="picks" role="radiogroup">' + list.map(function (r, i) {
    return '<label><input type="radio" name="' + name + '" value="' + esc(r) + '"' + (r === sel ? ' checked' : '') + '> ' + esc(r) + '</label>'; }).join('') + '</div>';
}
function picked(name) { var x = document.querySelector('input[name="' + name + '"]:checked'); return x ? x.value : ''; }
function hrRow(h) {
  var cls = h.action === 'Удалён' ? 'out' : h.action === 'Переведён' ? 'mv' : 'in';
  return '<div class="row"' + (h.empId && !S.pageFn ? ' data-emp="' + esc(h.empId) + '" style="cursor:pointer"' : '') + '><div class="main"><div class="name"><span class="ev ' + cls + '">' + esc(h.action) + '</span> ' + esc(h.empName || '') + '</div>' +
    '<div class="meta"><span>' + esc(h.reason || '') + (h.comment ? ' — ' + esc(h.comment) : '') + '</span></div><div class="meta hint" style="font-size:12px">' + fdate(h.date) + (h.objectName ? ' · ' + esc(h.objectName) : '') + (h.by ? ' · внёс ' + esc(h.by) : '') + '</div></div></div>';
}

function openEmpForm(e) {
  var boss = S.init.me.isBoss, cfg = S.init.config, isNew = !(e && e.id);
  e = e || { name: '', position: '', objectId: boss ? (S.obj || (S.init.objects[0] || {}).id) : S.init.me.objectId, rate: '', norm: 8, otk: 1.5, phone: '' };
  var showRate = boss || (isNew && cfg.canSetRate);
  var h = '<h3>' + (isNew ? 'Новый сотрудник' : 'Данные сотрудника') + '</h3>' + (!boss ? '<div class="muted">' + esc(objName(S.init.me.objectId)) + '</div>' : '') +
    '<div class="field"><label for="eName">ФИО</label><input id="eName" type="text" value="' + esc(e.name) + '" autocomplete="off" placeholder="Фамилия Имя Отчество"></div>' +
    '<div class="two"><div class="field"><label for="ePos">Должность</label><input id="ePos" type="text" value="' + esc(e.position) + '" placeholder="Например: каменщик"></div>' +
    (cfg.storePhones ? '<div class="field"><label for="ePhone">Телефон</label><input id="ePhone" type="tel" value="' + esc(e.phone || '') + '"></div>' : '<div></div>') + '</div>';
  if (boss || !e.isLead) h += '<div class="field"><label for="eTg">Telegram ID сотрудника <span class="hint">— необязательно</span></label><input id="eTg" type="text" inputmode="numeric" value="' + esc(e.tgId || '') + '" placeholder="Сотрудник открывает бота и видит свой номер">' +
    '<div class="hint" style="font-size:12px">Тогда сотрудник сам видит в боте свои часы и деньги и подтверждает получение зарплаты.</div></div>';
  var crew0 = e.crew || S.crew || 'День';
  h += '<div class="field"><label>Бригада</label><div class="shiftsw"><button type="button" data-ecrew="День" aria-pressed="' + (crew0 === 'День') + '">' + ic('sun') + 'Дневная</button><button type="button" data-ecrew="Ночь" aria-pressed="' + (crew0 === 'Ночь') + '">' + ic('moon') + 'Ночная</button></div></div>';
  if (boss && !isNew && (e.isLead || e.tgId)) {
    var lt = e.leadType || '', la = e.leadAmount || '';
    h += '<div class="field"><label>Доплата за бригадирство</label><div class="two"><select id="eLeadT"><option value=""' + (!lt ? ' selected' : '') + '>Нет доплаты</option>' +
      ['month', 'shift', 'hour'].map(function (k) { return '<option value="' + k + '"' + (lt === k ? ' selected' : '') + '>' + { month: 'Фикс. в месяц', shift: 'За каждую смену', hour: 'За каждый час' }[k] + '</option>'; }).join('') +
      '</select><input id="eLeadA" type="number" inputmode="decimal" placeholder="₽" value="' + esc(la) + '"></div><div class="hint" style="font-size:12px">Фикс. в месяц начисляется, если бригадир отработал хотя бы один день. Плюс к его зарплате по ставке.</div></div>';
  }
  if (boss) h += '<div class="field"><label for="eObj">Объект</label><select id="eObj">' + S.init.objects.map(function (o) { return '<option value="' + esc(o.id) + '"' + (o.id === e.objectId ? ' selected' : '') + '>' + esc(o.name) + '</option>'; }).join('') + '</select></div>';
  if (showRate) h += (boss ? '<div class="three">' : '<div class="two">') + '<div class="field"><label for="eRate">Ставка, ₽/ч</label><input id="eRate" type="number" inputmode="decimal" value="' + esc(e.rate) + '"></div>' +
    (boss ? '<div class="field"><label for="eNorm">Норма, ч/день</label><input id="eNorm" type="number" inputmode="decimal" value="' + esc(e.norm) + '"></div>' +
    '<div class="field"><label for="eOtk">Коэф. сверх.</label><input id="eOtk" type="number" inputmode="decimal" step="0.1" value="' + esc(e.otk) + '"></div>' : '') + (isNew && !boss ? '<div class="field"><label for="eDate">Первый день</label><input id="eDate" type="date" value="' + S.init.today + '"></div>' : '') + '</div>';
  if (isNew) {
    if (!showRate) h += '<div class="field"><label for="eDate">Первый день</label><input id="eDate" type="date" value="' + S.init.today + '"></div>';
    h += '<div class="field"><label>Основание приёма</label>' + reasonPicks('hireR', S.init.hireReasons, '') + '</div>' +
      '<div class="field"><label for="eCom">Комментарий</label><textarea id="eCom" maxlength="300" placeholder="Кого заменяет, откуда пришёл — по желанию"></textarea></div>';
  } else if (boss) {
    h += '<div class="field" id="mvBox" hidden><label for="eCom">Причина перевода</label><textarea id="eCom" maxlength="300" placeholder="Например: усиление бригады на объекте"></textarea></div>';
  }
  if (showRate && !isNew) h += '<div class="hint" style="font-size:13px">Новая ставка действует с новых отметок; прошлые дни не пересчитываются.</div>';
  if (!boss && isNew && !cfg.canSetRate) h += '<div class="hint" style="font-size:13px">Ставку укажет руководитель.</div>';
  h += '<div class="err" id="eErr" hidden></div><button class="btn block" id="eSave">' + (isNew ? 'Добавить в бригаду' : 'Сохранить') + '</button>';
  openSheet(h, function () {
    var objSel = $('#eObj');
    document.querySelectorAll('[data-ecrew]').forEach(function (b) { b.onclick = function () { crew0 = b.dataset.ecrew; document.querySelectorAll('[data-ecrew]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); }; });
    if (objSel && !isNew) objSel.onchange = function () { $('#mvBox').hidden = objSel.value === e.objectId; };
    $('#eSave').onclick = function () {
      var btn = this, err = $('#eErr');
      var p = { id: e.id, name: $('#eName').value, position: $('#ePos').value, phone: $('#ePhone') ? $('#ePhone').value : '', crew: crew0 };
      if ($('#eTg') && $('#eTg').value.trim() !== String(e.tgId || '')) p.tgId = $('#eTg').value.trim();
      if ($('#eLeadT')) { p.leadType = $('#eLeadT').value; p.leadAmount = $('#eLeadA').value; }
      if (objSel) p.objectId = objSel.value;
      if ($('#eRate')) p.rate = $('#eRate').value;
      if ($('#eNorm')) { p.norm = $('#eNorm').value; p.otk = $('#eOtk').value; }
      if (isNew) { p.reason = picked('hireR'); p.comment = $('#eCom').value; p.date = $('#eDate') ? $('#eDate').value : ''; }
      else if ($('#eCom')) p.comment = $('#eCom').value;
      if (isNew && !p.reason) { err.textContent = 'Выберите основание приёма'; err.hidden = false; return; }
      btn.disabled = true;
      api('saveEmployee', p).then(function () { closeSheet(); haptic('success'); toast(isNew ? 'Сотрудник добавлен' : 'Сохранено'); if (S.pageFn) S.pageFn(); else render(); })
        .catch(function (er) { btn.disabled = false; err.textContent = er.message; err.hidden = false; });
    };
  });
}

function openRemove(e) {
  var h = '<h3>Удалить из бригады</h3><div class="muted">' + esc(e.name) + ' · ' + esc(e.objectName || '') + '</div>' +
    '<div class="field"><label>Причина</label>' + reasonPicks('fireR', S.init.fireReasons, '') + '</div>' +
    '<div class="field"><label for="rCom">Комментарий</label><textarea id="rCom" maxlength="300" placeholder="Обязательно, если выбрано «Другое»"></textarea></div>' +
    '<div class="field"><label for="rDate">Последний рабочий день</label><input id="rDate" type="date" value="' + S.init.today + '"></div>' +
    '<div class="hint" style="font-size:13px">Табель, выплаты и история сохранятся. Сотрудника можно будет вернуть.</div>' +
    '<div class="err" id="rErr" hidden></div><button class="btn danger block" id="rGo">' + ic('trash') + 'Удалить из бригады</button><button class="btn sec block" id="rCancel">Отмена</button>';
  openSheet(h, function () {
    $('#rCancel').onclick = closeSheet;
    $('#rGo').onclick = function () {
      var btn = this, err = $('#rErr'), reason = picked('fireR'), com = $('#rCom').value.trim();
      if (!reason) { err.textContent = 'Выберите причину'; err.hidden = false; return; }
      if (reason === 'Другое' && !com) { err.textContent = 'Опишите причину в комментарии'; err.hidden = false; return; }
      btn.disabled = true;
      api('removeEmployee', { empId: e.id, reason: reason, comment: com, date: $('#rDate').value }).then(function () {
        closeSheet(); haptic('success'); toast(e.name + ' удалён из бригады'); if (S.pageFn) S.pageFn(); render();
      }).catch(function (er) { btn.disabled = false; err.textContent = er.message; err.hidden = false; });
    };
  });
}
function openRestore(e) {
  var boss = S.init.me.isBoss;
  var h = '<h3>Вернуть в бригаду</h3><div class="muted">' + esc(e.name) + '</div>' +
    (boss ? '<div class="field"><label for="bObj">На объект</label><select id="bObj">' + S.init.objects.map(function (o) { return '<option value="' + esc(o.id) + '"' + (o.id === e.objectId ? ' selected' : '') + '>' + esc(o.name) + '</option>'; }).join('') + '</select></div>' : '') +
    '<div class="field"><label for="bCom">Комментарий</label><textarea id="bCom" maxlength="300" placeholder="Например: вернулся после переезда"></textarea></div>' +
    '<div class="err" id="bErr" hidden></div><button class="btn block" id="bGo">' + ic('undo') + 'Вернуть</button>';
  openSheet(h, function () {
    $('#bGo').onclick = function () {
      var btn = this; btn.disabled = true;
      api('restoreEmployee', { empId: e.id, objectId: $('#bObj') ? $('#bObj').value : '', comment: $('#bCom').value }).then(function () {
        closeSheet(); haptic('success'); toast('Сотрудник снова в бригаде'); if (S.pageFn) S.pageFn(); render();
      }).catch(function (er) { btn.disabled = false; $('#bErr').textContent = er.message; $('#bErr').hidden = false; });
    };
  });
}

/* ================= ВЫПЛАТЫ ================= */
function openPayout(objId, month) {
  var pg = $('#page'); pg.hidden = false;
  pg.innerHTML = '<div class="top"><div class="wrap"><button class="icon-btn" id="pBack" aria-label="Назад">' + ic('back') + '</button><b style="flex:1">Выплата зарплаты</b></div></div><main class="wrap" id="pBody"><div class="empty">Загрузка…</div></main>';
  $('#pBack').onclick = closePage;
  if (IN_TG && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closePage); }
  S.pageFn = function () { openPayout(objId, month); };
  api('month', { month: month, objectId: objId || '' }).then(function (d) {
    var due = d.rows.filter(function (r) { return r.toPay > 0.5; }), done = d.rows.filter(function (r) { return r.toPay <= 0.5 && (r.paid || r.advance); });
    var sel = {}; due.forEach(function (r) { sel[r.empId] = true; });
    function total() { return due.reduce(function (s, r) { return s + (sel[r.empId] ? r.toPay : 0); }, 0); }
    function count() { return due.filter(function (r) { return sel[r.empId]; }).length; }
    var cashNow = !S.init.me.isBoss && S.init.config.payScheme !== 'direct' ? (S.init.cash || { balance: 0, pending: 0 }) : null;
    var h = '<div class="stack" style="padding-top:12px"><div class="card hero"><div class="lbl">' + esc(objId ? objName(objId) : 'Все объекты') + ' · за ' + fmtMonth(month).toLowerCase() + '</div>' +
      '<div class="big">' + money(d.totals.toPay) + '</div><div class="delta">осталось выплатить · начислено ' + money(d.totals.accrued) + ', уже выплачено ' + money(d.totals.advance + d.totals.paid) + '</div></div>';
    if (due.length) {
      h += '<div class="card"><h2>Кому выплатить <span class="r"><button class="btn ghost sm" id="selAll" style="padding:0">снять все</button></span></h2><div>' + due.map(function (r) {
        return '<label class="pay-row"><input type="checkbox" data-pay="' + esc(r.empId) + '" checked><div style="flex:1;min-width:0"><div style="font-weight:500">' + esc(r.name) + '</div>' +
          '<div class="meta num" style="font-size:12px;color:var(--muted)">' + nf1.format(r.hours) + ' ч × ' + nf0.format(r.rate) + ' ₽ → ' + money(r.sum) + (r.bonus ? ' + премия ' + money(r.bonus) : '') + (r.deduction ? ' − удерж. ' + money(r.deduction) : '') + (r.advance || r.paid ? ' − выплачено ' + money(r.advance + r.paid) : '') + '</div></div>' +
          '<div class="num" style="font-weight:600">' + money(r.toPay) + '</div></label>';
      }).join('') + '</div></div>' +
        '<div class="card"><div class="two"><div class="field"><label for="pDate">Дата выплаты</label><input id="pDate" type="date" value="' + S.init.today + '"></div>' +
        '<div class="field"><label for="pCom">Комментарий</label><input id="pCom" type="text" maxlength="200" placeholder="Например: наличными"></div></div>' +
        (cashNow ? '<div class="hint" id="pCash" style="font-size:13px;margin-top:10px"></div>' : '') +
        '<div class="err" id="pErr" hidden></div><button class="btn block" id="pGo" style="margin-top:12px"></button></div>';
    } else h += '<div class="card empty"><p>Всё выплачено</p></div>';
    if (done.length) h += '<div class="card"><h2>Уже выплачено</h2><div class="list">' + done.map(function (r) {
      return '<div class="row"><div class="main"><div class="name">' + esc(r.name) + '</div><div class="meta num">' + money(r.accrued) + '</div></div><div class="side"><span class="chip good">' + ic('check') + 'выплачено</span></div></div>'; }).join('') + '</div></div>';
    h += '</div>';
    $('#pBody').innerHTML = h;
    var go = $('#pGo');
    function upd() {
      if (!go) return;
      var n = count(), tot = total(), short = cashNow ? tot - cashNow.balance : 0;
      go.disabled = !n || short > 0.5; go.dataset.sure = ''; go.classList.remove('danger');
      go.innerHTML = ic('wallet') + (n ? 'Выплатить ' + n + ' ' + plural(n, 'сотруднику', 'сотрудникам', 'сотрудникам') + ' · ' + money(tot) : 'Никто не выбран');
      var pc = $('#pCash');
      if (pc) pc.innerHTML = 'В кассе: <b class="num">' + money(cashNow.balance) + '</b>' + (short > 0.5 ? ' — <span style="color:var(--crit)">не хватает ' + money(short) + '.</span> ' + (cashNow.pending ? 'Подтвердите получение ' + money(cashNow.pending) + ' во вкладке «Бригада».' : 'Попросите руководителя передать деньги или снимите галочки.') : ' · после выплаты останется ' + money(cashNow.balance - tot));
    }
    upd();
    $('#pBody').querySelectorAll('[data-pay]').forEach(function (cb) { cb.onchange = function () { sel[cb.dataset.pay] = cb.checked; upd(); }; });
    var sa = $('#selAll'); if (sa) sa.onclick = function (ev) {
      ev.preventDefault(); var any = count() > 0;
      $('#pBody').querySelectorAll('[data-pay]').forEach(function (cb) { cb.checked = !any; sel[cb.dataset.pay] = !any; });
      sa.textContent = any ? 'выбрать всех' : 'снять все'; upd(); };
    if (go) go.onclick = function () {
      if (go.dataset.sure !== '1') { go.dataset.sure = '1'; go.innerHTML = 'Нажмите ещё раз, чтобы подтвердить · ' + money(total()); go.classList.add('danger'); return; }
      go.disabled = true; go.textContent = 'Провожу выплату…';
      var items = due.filter(function (r) { return sel[r.empId]; }).map(function (r) { return { empId: r.empId, amount: r.toPay }; });
      api('payout', { month: month, items: items, date: $('#pDate').value, comment: $('#pCom').value }).then(function (res) {
        haptic('success'); toast('Выплачено ' + res.count + ' ' + plural(res.count, 'сотруднику', 'сотрудникам', 'сотрудникам') + ': ' + money(res.total));
        if (res.cash) S.init.cash = res.cash;
        forget(); S.pageFn && S.pageFn(); if (S.tab === 'dash' || S.tab === 'staff') render();
      }).catch(function (e) { go.disabled = false; upd(); $('#pErr').textContent = e.message; $('#pErr').hidden = false; });
    };
  }).catch(function (e) { $('#pBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}
function openPayEmp(e, month, amount) {
  openSheet('<h3>Выплатить зарплату</h3><div class="muted">' + esc(e.name) + ' · за ' + fmtMonth(month).toLowerCase() + '</div>' +
    '<div class="two"><div class="field"><label for="yAmt">Сумма, ₽</label><input id="yAmt" type="number" inputmode="decimal" value="' + Math.round(amount * 100) / 100 + '"></div>' +
    '<div class="field"><label for="yDate">Дата</label><input id="yDate" type="date" value="' + S.init.today + '"></div></div>' +
    '<div class="field"><label for="yCom">Комментарий</label><input id="yCom" type="text" maxlength="200" placeholder="Например: на карту"></div>' +
    '<div class="hint" style="font-size:13px">Можно выплатить часть — остаток останется «к выплате».' + (S.init.cash ? ' В кассе: ' + money(S.init.cash.balance) + '.' : '') + '</div><div class="err" id="yErr" hidden></div><button class="btn block" id="yGo">' + ic('wallet') + 'Выплатить</button>', function () {
    $('#yGo').onclick = function () {
      var b = this; b.disabled = true;
      api('payout', { month: month, items: [{ empId: e.id, amount: $('#yAmt').value }], date: $('#yDate').value, comment: $('#yCom').value }).then(function (res) {
        closeSheet(); haptic('success'); toast('Выплачено ' + money(res.total)); if (res.cash) S.init.cash = res.cash; forget(); S.pageFn && S.pageFn();
      }).catch(function (er) { b.disabled = false; $('#yErr').textContent = er.message; $('#yErr').hidden = false; });
    };
  });
}

/* ================= ПЕРЕДАЧА ДЕНЕГ БРИГАДИРУ (руководитель) ================= */
function openTransfer(o, month) {
  var fms = o.foremen || [], f0 = fms[0] || {};
  var h = '<h3>Передать бригадиру</h3><div class="muted">' + esc(o.name) + ' · зарплата за ' + fmtMonth(month).toLowerCase() + '</div>' +
    '<div class="receipt"><div><span>Осталось выплатить сотрудникам</span><span>' + money(o.toPay) + '</span></div>' +
    '<div><span>У бригадира на руках</span><span>' + money(o.cash || 0) + '</span></div>' + (o.inTransit ? '<div><span>Передано, ждёт подтверждения</span><span>' + money(o.inTransit) + '</span></div>' : '') +
    '<div class="sum"><span>Нужно передать</span><span>' + money(o.needTransfer || 0) + '</span></div></div>' +
    (fms.length > 1 ? '<div class="field"><label for="tFm">Бригадир</label><select id="tFm">' + fms.map(function (f) { return '<option value="' + esc(f.tgId) + '">' + esc(f.name) + ' · на руках ' + money(f.balance) + '</option>'; }).join('') + '</select></div>'
      : '<div class="muted">Бригадир: <b>' + esc(f0.name || '') + '</b></div>') +
    '<div class="two"><div class="field"><label for="tAmt">Сумма, ₽</label><input id="tAmt" type="number" inputmode="decimal" value="' + Math.round(o.needTransfer || o.toPay || 0) + '"></div>' +
    '<div class="field"><label for="tDate">Дата</label><input id="tDate" type="date" value="' + S.init.today + '"></div></div>' +
    '<div class="field"><label for="tCom">Комментарий</label><input id="tCom" type="text" maxlength="200" placeholder="Например: наличными / на карту"></div>' +
    '<div class="hint" style="font-size:13px">Бригадир увидит передачу и подтвердит получение. После этого он сможет выплатить зарплату сотрудникам.</div>' +
    '<div class="err" id="tErr" hidden></div><button class="btn block" id="tGo">' + ic('wallet') + 'Передать</button><div id="tHist"></div>';
  openSheet(h, function () {
    function hist() {
      var tg0 = $('#tFm') ? $('#tFm').value : f0.tgId; if (!tg0) return;
      api('cash', { tgId: tg0 }).then(function (c) {
        var box = $('#tHist'); if (!box) return;
        box.innerHTML = c.transfers.length ? '<div class="field" style="margin-top:6px"><label>Последние передачи</label><div class="list">' + c.transfers.slice(0, 6).map(function (t) {
          return '<div class="row"><div class="main"><div class="name num">' + money(t.amount) + '</div><div class="meta">' + fdate(t.date) + ' · за ' + esc(fmtMonth(t.month).toLowerCase()) + (t.comment ? ' · ' + esc(t.comment) : '') + '</div></div><div class="side">' +
            (t.status === 'Получено' ? '<span class="chip good">' + ic('check') + 'получено</span>' : '<span class="chip warn">' + ic('alert') + 'ждёт</span><br><button class="btn ghost sm" data-cancel-tr="' + esc(t.id) + '" style="padding:2px 0;font-size:12px;color:var(--crit)">отменить</button>') + '</div></div>';
        }).join('') + '</div></div>' : '';
        box.querySelectorAll('[data-cancel-tr]').forEach(function (b) { b.onclick = function () {
          if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'точно отменить?'; return; }
          b.disabled = true; api('cancelTransfer', { id: b.dataset.cancelTr }).then(function () { toast('Передача отменена'); forget(); closeSheet(); render(); }).catch(fail); }; });
      }).catch(function () {});
    }
    hist(); if ($('#tFm')) $('#tFm').onchange = hist;
    $('#tGo').onclick = function () {
      var b = this;

function pickPhoto(cb) {
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function () {
    var f = inp.files && inp.files[0]; if (!f) return;
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      cb(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function () { toast('Не удалось открыть фото'); };
    img.src = url;
  };
  inp.click();
}
function showPhoto(src) {
  if (/^https?:/.test(src)) return openLink(src);

      if (i.disputes) warn.push(i.disputes + ' ' + plural(i.disputes, 'сотрудник сообщил', 'сотрудника сообщили', 'сотрудников сообщили') + ', что не получил деньги');

        openSheet('<h3>Отчёт готов</h3><div class="muted" style="font-size:14px">' + esc(r.title) + '</div>' +
          '<button class="btn block" id="xOpen">Открыть Google Таблицу</button><button class="btn sec block" id="xXlsx">Скачать Excel (.xlsx)</button>' +
          '<div class="hint" style="font-size:13px">' + (r.share === 'private' ? 'Файл сохранён в папке «' + esc(r.folder || 'Отчёты табеля') + '» на Google Диске владельца таблицы. Открыть его может только владелец — для посторонних ссылка не работает.'
            : 'Файл сохранён на Google Диске. Его можно открыть по ссылке — не пересылайте её посторонним, в отчёте зарплаты.') + '</div>', function () {
          $('#xOpen').onclick = function () { openLink(r.url); };
          $('#xXlsx').onclick = function () { openLink(r.xlsxUrl); };
        });
      }).catch(function (e) { btn.disabled = false; btn.textContent = 'Создать Google Таблицу'; fail(e); });
    };
  });
}
function exportPreview(r) {
  var cur = 0;
  function draw() {
    var s = r.sheets[cur];
    var h = '<h3>Так будет выглядеть отчёт</h3><div class="muted" style="font-size:13px">В демо таблица не создаётся. В рабочей версии откроется Google Таблица с этими листами.</div>' +
      '<div class="tabs2">' + r.sheets.map(function (x, i) { return '<button data-i="' + i + '" aria-pressed="' + (i === cur) + '">' + esc(x.name) + '</button>'; }).join('') + '</div>' +
      '<div class="xtable"><table><thead><tr>' + s.header.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      s.rows.slice(0, 40).map(function (row) { return '<tr>' + row.map(function (c) { return '<td' + (typeof c === 'number' ? ' class="num" style="text-align:right"' : '') + '>' + esc(typeof c === 'number' ? nf1.format(c) : c) + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></div>' + (s.rows.length > 40 ? '<div class="hint" style="font-size:12px">Показаны первые 40 строк из ' + s.rows.length + '</div>' : '') + '<button class="btn sec block" id="xClose">Закрыть</button>';
    openSheet(h, function (sh) {
      sh.querySelectorAll('[data-i]').forEach(function (b) { b.onclick = function () { cur = +b.dataset.i; draw(); }; });
      $('#xClose').onclick = closeSheet;
    });
  }
  draw();
}

/* ================= служебные экраны ================= */
function renderUnknown(j) {
  $('#tabs').hidden = true; $('#top .wrap').innerHTML = '<div class="title-row"><h1>Табель бригад</h1></div>';
  $('#view').innerHTML = '<div class="center-screen"><div style="font-size:18px;font-weight:600">' + esc(j.tgName || 'Здравствуйте') + ', вас пока нет в списке</div>' +
    '<div class="muted">Передайте этот номер руководителю или бригадиру — они откроют вам доступ.<br>Ваш Telegram ID:</div><div class="id" id="tgId">' + esc(j.tgId) + '</div>' +
    '<button class="btn sec" id="cp">Скопировать ID</button><div class="hint" style="font-size:13px">После этого закройте и снова откройте приложение.</div></div>';
  $('#cp').onclick = function () { navigator.clipboard && navigator.clipboard.writeText(j.tgId).then(function () { toast('Скопировано'); }, function () { toast('Выделите номер и скопируйте'); }); };
}
function renderOutside() {
  $('#top .wrap').innerHTML = '<div class="title-row"><h1>Табель бригад</h1></div>';
  $('#view').innerHTML = '<div class="center-screen"><div style="font-size:18px;font-weight:600">Откройте приложение через бота в Telegram</div><div class="muted">Вход по вашему Telegram-аккаунту, пароль не нужен.</div><button class="btn" id="goDemo">Посмотреть демо</button></div>';
  $('#goDemo').onclick = function () { startDemo(); };
}
function demoBar() {
  var bar = $('#demo'); bar.hidden = false;
  var objs = Demo.objects();
  bar.innerHTML = '<div class="wrap"><b>Демо</b><span>данные вымышленные · смотреть как</span><select id="demoRole" aria-label="Смотреть как">' + Demo.users().map(function (u) {
    var o = objs.filter(function (x) { return x.id === u.objectId; })[0];
    var who = u.role === 'Старший смены' ? u.role + ' (' + (u.crew === 'Ночь' ? 'ночь' : 'день') + ') ' + u.name : u.role === 'Сотрудник' ? 'Сотрудник ' + u.name : u.role;
    return '<option value="' + u.tgId + '"' + (u.tgId === Demo.role() ? ' selected' : '') + '>' + esc(who + ' — ' + (o ? o.name : 'все объекты')) + '</option>'; }).join('') + '</select></div>';
  $('#demoRole').onchange = function () { Demo.setRole(this.value); closePage(); boot(); };
}

/* ================= запуск ================= */
function applyInit(d, fetchedAt) {
  S.init = d;
  var t = d.today.split('-'), hm = (d.time || '00:00').split(':');
  S.offset = Date.UTC(+t[0], +t[1] - 1, +t[2], +hm[0], +hm[1]) - (fetchedAt || Date.now());
  S.skew = d.epoch ? d.epoch - (fetchedAt || Date.now()) : 0;      // поправка на неверные часы телефона
  d.today = serverNow().date;
  if (d.first) cput(ckey(d.first.action, d.first.params), d.first.data);
  if (!DEMO && d.version !== Core.VERSION && !$('#oldsrv')) {
    var old = document.createElement('div'); old.className = 'wrap'; old.id = 'oldsrv';
    old.innerHTML = '<div class="notice" style="margin-top:10px"><b>Сервер работает на старой версии кода.</b> Часть функций не будет работать. В Apps Script: «Начать развертывание → Управление развертываниями → карандаш → Версия: Новая версия → Развернуть».</div>';
    $('#top').appendChild(old);
  }
}
function boot() {
  S.obj = ''; S.staffQ = '';
  qLoad();
  try { S.crew = localStorage.getItem(cpre() + 'crew') || 'День'; } catch (x) { S.crew = 'День'; }
  var cached = cget('init');
  function start(d) {
    S.date = d.today; S.month = Core.util.monthOf(d.today);
    S.tab = d.me.isBoss ? 'dash' : d.me.role === 'Сотрудник' ? 'me' : 'today';
    if (d.me.role === 'Старший смены') S.crew = d.me.crew || 'День';
    renderTabs(); render();
  }
  if (cached && cached.d.me) {                        // мгновенный старт из сохранённого, свежие данные — следом
    applyInit(cached.d, cached.t); start(cached.d);
    api('init', { withFirst: true }).then(function (d) {
      cput('init', d); applyInit(d); renderTabs();
      if (d.first && S.tab === ({ dashboard: 'dash', me: 'me', day: 'today' })[d.first.action]) render();
      qRun();
    }).catch(function (e) { if (!e.silent) toast(navigator.onLine === false ? 'Нет интернета — показаны сохранённые данные' : 'Не удалось обновить: ' + e.message); });
    return;
  }
  api('init', { withFirst: true }).then(function (d) {
    cput('init', d); applyInit(d); start(d); qRun();
  }).catch(function (e) { if (!e.silent) { $('#top .wrap').innerHTML = '<div class="title-row"><h1>Табель бригад</h1></div>'; errorView(e); } });
}
function startDemo() { DEMO = true; demoBar(); boot(); }

function applyTheme() {
  if (!tg) return;
  var p = tg.themeParams || {}, r = document.documentElement;
  if (tg.colorScheme) r.setAttribute('data-theme', tg.colorScheme);
  var set = function (k, v) { if (v) r.style.setProperty(k, v); };
  set('--bg', p.secondary_bg_color); set('--surface', p.section_bg_color || p.bg_color); set('--fg', p.text_color);
  set('--muted', p.subtitle_text_color || p.hint_color); set('--hint', p.hint_color); set('--accent', p.button_color); set('--accent-fg', p.button_text_color);
  try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
}

if (IN_TG) {
  tg.ready(); tg.expand(); applyTheme(); tg.onEvent('themeChanged', applyTheme);
  if (!API_URL || API_URL.indexOf('__') === 0) { startDemo(); }
  else if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec\/?$/.test(API_URL.trim())) {
    $('#top .wrap').innerHTML = '<div class="title-row"><h1>Табель бригад</h1></div>';
    var er = new Error('Неверный адрес сервера в index.html'); er.net = true; errorView(er);
  } else { API_URL = API_URL.trim(); boot(); }
} else if (!API_URL || API_URL.indexOf('__') === 0) {
  startDemo();
} else {
  renderOutside();
}
})();
</script>
